<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Piano Hero</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d0f10;
      --cream: #f2eee5;
      --gold: #f2ad3b;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #080909;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: grid;
      place-items: center;
    }

    #game-shell {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #0a0b0c;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    #top-actions {
      position: absolute;
      top: 16px;
      right: 18px;
      z-index: 5;
      display: flex;
      gap: 8px;
      opacity: 0;
      transition: opacity 180ms ease;
      pointer-events: none;
    }

    #game-shell:hover #top-actions,
    #top-actions:focus-within {
      opacity: 1;
      pointer-events: auto;
    }

    .icon-btn {
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(12,14,15,.72);
      color: #fff;
      min-width: 38px;
      height: 38px;
      padding: 0 12px;
      border-radius: 10px;
      backdrop-filter: blur(8px);
      cursor: pointer;
      font-weight: 800;
      letter-spacing: .04em;
    }

    .icon-btn:hover { background: rgba(28,31,33,.9); }

    #sr-status {
      position: fixed;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    #yt-wrap {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 2px;
      height: 2px;
      overflow: hidden;
      opacity: .01;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <main id="game-shell" aria-label="Piano Hero, jogo de ritmo musical">
    <canvas id="game" tabindex="0" aria-describedby="sr-status"></canvas>
    <div id="top-actions">
      <button class="icon-btn" id="pauseBtn" type="button" title="Pausar ou continuar">P</button>
      <button class="icon-btn" id="muteBtn" type="button" title="Ativar ou desativar áudio">ÁUDIO</button>
      <button class="icon-btn" id="fullscreenBtn" type="button" title="Tela cheia">⛶</button>
    </div>
    <div id="sr-status" aria-live="polite">Pressione Enter para começar.</div>
  </main>
  <div id="yt-wrap" aria-hidden="true"><div id="yt-audio"></div></div>

      function currentDisc() { return DISCS[state.discIndex]; }
      function discSongs(disc) { return disc.songIds.map(id => SONGS[SONG_INDEX_BY_ID[id]]); }

      function currentSong() { return SONGS[state.songIndex]; }
      function songLength(song) { return song.endAtSec - song.startAtSec; }
      function songBeat(song) { return 60 / song.bpm; }
      function getBeatSec() { return songBeat(currentSong()); }

      function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

      function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
      function easeInQuad(t) { return t * t; }
      function formatScore(value) { return Math.max(0, Math.floor(value)).toLocaleString('en-US'); }
      function nowSec() { return performance.now() / 1000; }
      function neonPulse() { return 0.85 + 0.15 * Math.sin(nowSec() * 2.2); }
      function fmtMult(m) { return String(parseFloat(m.toFixed(2))); }

      function seededRandom(seed) {
        let x = seed >>> 0;
        return () => {
          x += 0x6D2B79F5;
          let t = x;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function roundRectPath(c, x, y, w, h, r) {
        const rr = Math.min(r, w / 2, h / 2);
        c.beginPath();
        c.moveTo(x + rr, y);
        c.arcTo(x + w, y, x + w, y + h, rr);
        c.arcTo(x + w, y + h, x, y + h, rr);
        c.arcTo(x, y + h, x, y, rr);
        c.arcTo(x, y, x + w, y, rr);
        c.closePath();
      }

      function fillRoundRect(x, y, w, h, r, fill) {
        roundRectPath(ctx, x, y, w, h, r);
        ctx.fillStyle = fill;
        ctx.fill();
      }

      function strokeRoundRect(x, y, w, h, r, stroke, lineWidth = 1) {
        roundRectPath(ctx, x, y, w, h, r);
        ctx.strokeStyle = stroke;
        ctx.lineWidth = lineWidth;
        ctx.stroke();
      }

      function fitCanvas() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const rect = canvas.getBoundingClientRect();
        canvas.width = Math.round(rect.width * dpr);
        canvas.height = Math.round(rect.height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        state.viewW = rect.width;
        state.viewH = rect.height;
        state.scale = Math.min(rect.width / DESIGN_W, rect.height / DESIGN_H);
        state.offsetX = (rect.width - DESIGN_W * state.scale) / 2;
        state.offsetY = (rect.height - DESIGN_H * state.scale) / 2;
      }

      function toDesign(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        return {
          x: (clientX - rect.left - state.offsetX) / state.scale,
          y: (clientY - rect.top - state.offsetY) / state.scale
        };
      }

      function beginScene() {
        ctx.save();
        ctx.translate(state.offsetX, state.offsetY);
        ctx.scale(state.scale, state.scale);
      }

      function endScene() { ctx.restore(); }

      function setupAudio() {
        if (state.audioReady) {
          if (state.audioCtx && state.audioCtx.state === 'suspended') state.audioCtx.resume();
          return;
        }
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        state.audioCtx = new AC();
        state.masterGain = state.audioCtx.createGain();
        state.masterGain.gain.value = state.muted ? 0 : 0.5;
        state.masterGain.connect(state.audioCtx.destination);
        state.audioReady = true;
      }

      function setMuted(muted) {
        state.muted = muted;
        if (state.masterGain) {
          state.masterGain.gain.setTargetAtTime(muted ? 0 : 0.5, state.audioCtx.currentTime, 0.02);
        }
        yt.setMuted(muted);
        muteBtn.textContent = muted ? 'MUDO' : 'ÁUDIO';
      }

      function playTone(freq, duration = 0.15, volume = 0.22, type = 'triangle', detune = 0) {
        if (!state.audioReady || state.muted) return;
        const t = state.audioCtx.currentTime;
        const osc = state.audioCtx.createOscillator();
        const gain = state.audioCtx.createGain();
        const filter = state.audioCtx.createBiquadFilter();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, t);
        osc.detune.setValueAtTime(detune, t);
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(2200, t);
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(Math.max(0.0002, volume), t + 0.008);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(state.masterGain);
        osc.start(t);
        osc.stop(t + duration + 0.04);
      }

      function playHitSound(lane, quality) {
        const scale = [261.63, 293.66, 329.63, 349.23, 392, 440, 493.88, 523.25];
        const q = quality === 'perfect' ? 1 : quality === 'great' ? 0.85 : 0.7;
        const f = scale[lane % scale.length];
        playTone(f, 0.16, 0.17 * q, 'triangle');
        playTone(f * 2, 0.09, 0.06 * q, 'sine', quality === 'perfect' ? 4 : 0);
      }

      function playBeatSound(strong) {
        if (!state.audioReady || state.muted) return;
        const t = state.audioCtx.currentTime;
        const osc = state.audioCtx.createOscillator();
        const gain = state.audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(strong ? 95 : 72, t);
        osc.frequency.exponentialRampToValueAtTime(42, t + 0.1);
        gain.gain.setValueAtTime(strong ? 0.12 : 0.07, t);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.13);
        osc.connect(gain);
        gain.connect(state.masterGain);
        osc.start(t);
        osc.stop(t + 0.14);
      }

      function playMissSound() {
        if (!state.audioReady || state.muted) return;
        const t = state.audioCtx.currentTime;
        const buffer = state.audioCtx.createBuffer(1, state.audioCtx.sampleRate * 0.08, state.audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
        const src = state.audioCtx.createBufferSource();
        const gain = state.audioCtx.createGain();
        const filter = state.audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 430;
        gain.gain.value = 0.13;
        src.buffer = buffer;
        src.connect(filter);
        filter.connect(gain);
        gain.connect(state.masterGain);
        src.start(t);
      }

      // ==================== YouTube (somente áudio) ====================

      const yt = {
        player: null,
        ready: false,
        primed: false,
        blocked: {},
        currentId: null,
        init() {
          // O IIFE não expõe nada no window; a API exige o callback global.
          window.onYouTubeIframeAPIReady = () => {
            const vars = { controls: 0, disablekb: 1, rel: 0, playsinline: 1, iv_load_policy: 3 };
            if (location.protocol.indexOf('http') === 0) vars.origin = location.origin;
            yt.player = new YT.Player('yt-audio', {
              width: 2,
              height: 2,
              playerVars: vars,
              events: { onReady: yt.onReady, onStateChange: yt.onStateChange, onError: yt.onError }
            });
          };
          const s = document.createElement('script');
          s.src = 'https://www.youtube.com/iframe_api';
          s.async = true;
          document.head.appendChild(s);
        },
        onReady() {
          yt.ready = true;
          if (state.pendingStart != null && state.screen === 'songSelect') {
            const i = state.pendingStart;
            state.pendingStart = null;
            startSong(i);
          }
        },
        load(song) {
          if (!yt.player) return;
          yt.currentId = song.id;
          yt.primed = false;
          try {
            yt.player.mute(); // priming silencioso durante o countdown
            yt.player.loadVideoById({ videoId: song.youtubeId, startSeconds: song.startAtSec });
          } catch (_) {}
        },
        play() { try { yt.player.playVideo(); } catch (_) {} },
        pause() { try { yt.player.pauseVideo(); } catch (_) {} },
        seek(s) { try { yt.player.seekTo(s, true); } catch (_) {} },
        setMuted(m) { try { m ? yt.player.mute() : yt.player.unMute(); } catch (_) {} },
        getTime() { try { return yt.player.getCurrentTime() || 0; } catch (_) { return 0; } },
        onStateChange(e) {
          const S = window.YT.PlayerState;
          if (e.data === S.PLAYING) {
            if (!yt.primed && (state.screen === 'countdown' || state.screen === 'paused')) {
              // Buffer pronto: estaciona no início e libera o volume.
              yt.pause();
              yt.seek(currentSong().startAtSec);
              yt.primed = true;
              if (!state.muted) yt.setMuted(false);
            } else if (state.screen === 'playing') {
              if (!yt.primed) {
                yt.primed = true;
                if (!state.muted) yt.setMuted(false);
              }
              clockOnPlaying(yt.getTime());
            } else {
              yt.pause(); // nada deve tocar fora do gameplay
            }
          } else if (e.data === S.BUFFERING && state.screen === 'playing') {
            clockFreeze();
          } else if (e.data === S.ENDED && state.screen === 'playing') {
            endGame(false);
          }
        },
        onError(e) {
          if (yt.currentId) yt.blocked[yt.currentId] = e.data;
          if (state.screen === 'countdown' || state.screen === 'playing') {
            state.screen = 'songSelect';
            showToast('Não foi possível reproduzir este vídeo. Escolha outra música.', 3500);
            srStatus.textContent = 'Erro ao carregar o vídeo. Escolha outra música.';
          }
        }
      };

      // Clock híbrido: extrapolação por performance.now() re-ancorada em getCurrentTime()
      const clock = {
        anchored: false,
        frozen: false,
        frozenValue: 0,
        frozenAtPerf: 0,
        aMedia: 0,
        aPerf: 0,
        rate: 1,
        lastPoll: 0
      };
      const CLOCK_POLL = 0.25;
      const CLOCK_SLEW_GAIN = 1.0;
      const CLOCK_MAX_SLEW = 0.04;  // corrige no máx. 40 ms por segundo — imperceptível
      const CLOCK_HARD_SNAP = 0.30; // acima disso, salto direto (início/seek/rebuffer)

      function clockReset() {
        clock.anchored = false;
        clock.frozen = false;
        clock.rate = 1;
        clock.lastPoll = 0;
      }

      function clockOnPlaying(mediaT) {
        clock.aMedia = mediaT;
        clock.aPerf = nowSec();
        clock.rate = 1;
        clock.anchored = true;
        clock.frozen = false;
        state.awaitingAudio = false;
      }

      function clockFreeze() {
        if (clock.frozen) return;
        clock.frozenValue = currentSongTime();
        clock.frozen = true;
        clock.frozenAtPerf = nowSec();
      }

      function clockUpdate() {
        if (!clock.anchored || clock.frozen) return;
        const now = nowSec();
        if (now - clock.lastPoll < CLOCK_POLL) return;
        clock.lastPoll = now;
        const poll = yt.getTime();
        const est = clock.aMedia + (now - clock.aPerf) * clock.rate;
        const drift = poll - est;
        if (Math.abs(drift) > CLOCK_HARD_SNAP) {
          clock.aMedia = poll;
          clock.aPerf = now;
          clock.rate = 1;
        } else {
          clock.aMedia = est;
          clock.aPerf = now;
          clock.rate = 1 + clamp(drift * CLOCK_SLEW_GAIN, -CLOCK_MAX_SLEW, CLOCK_MAX_SLEW);
        }
      }

      function clockSongTime() {
        const song = currentSong();
        const media = clock.aMedia + (nowSec() - clock.aPerf) * clock.rate;
        // Offset positivo adianta as notas em relação ao áudio (tecla '.').
        return (media - song.startAtSec) + (song.offsetMs + state.calibMs) / 1000;
      }

      // ==================== Charts ====================

      function makeNote(time, lane, type, duration) {
        return { time, lane, type, duration, hit: false, missed: false, quality: null };
      }

      function chartBuilderApi(song, notes) {
        let spb = 60 / song.gridBpm;       // segundos por beat da seção atual
        let barBeats = song.beatsPerBar;   // beats por compasso da seção atual
        let originSec = 0;                 // âncora (segundos de chart) do beat 0 da seção
        let shiftSec = 0;                  // micro-ajuste de rubato dentro da seção
        const at = beat => originSec + beat * spb + shiftSec;
        return {
          tap(beat, lane) { notes.push(makeNote(at(beat), lane, 'tap', 0)); },
          hold(beat, lane, durBeats) { notes.push(makeNote(at(beat), lane, 'hold', durBeats * spb)); },
          boost(beat, lane) { notes.push(makeNote(at(beat), lane, 'boost', 0)); },
          pattern(startBeat, seq, step = 1, reps = 1) {
            let b = startBeat;
            for (let r = 0; r < reps; r++) {
              for (const ch of seq) {
                if (ch !== '.') this.tap(b, +ch);
                b += step;
              }
            }
            return b;
          },
          // Re-ancora a origem do tempo: beats voltam a contar de 0 a partir de anchorSec.
          // Zera o erro acumulado de BPM a cada seção — essencial em músicas de 6-7 min
          // e em mudanças de andamento (One). Zera shiftSec: âncora absoluta não herda rubato.
          section(anchorSec, bpm = song.gridBpm, beatsPerBar = song.beatsPerBar) {
            originSec = anchorSec;
            spb = 60 / bpm;
            barBeats = beatsPerBar;
            shiftSec = 0;
          },
          shift(sec) { shiftSec += sec; }, // re-sync de rubato local à seção
          bar: n => n * barBeats
        };
      }

      // Moonlight Sonata, 1º movimento — compasso 2/2, 12 colcheias de tercina por compasso.
      // Ostinato G#–C#–E vira ciclos nas pistas 0-2; a melodia sustentada vive na pista 3.
      function buildMoonlightChart(song) {
        const notes = [];
        const c = chartBuilderApi(song, notes);
        const b = c.bar;

        // Intro pp (0–3)
        for (let i = 0; i < 4; i++) c.pattern(b(i), '012012', 2);

        // Tema A (4–13): ostinato + melodia em holds na pista 3
        for (let i = 4; i < 14; i++) c.pattern(b(i), i % 2 ? '120120' : '012012', 2);
        for (const i of [4, 6, 10, 12]) { // o compasso 8 recebe boost no lugar
          c.tap(b(i) - 2, 3);
          c.tap(b(i) - 1, 3);
          c.hold(b(i), 3, 6);
        }

        // Tema B no baixo (14–22)
        for (let i = 14; i < 23; i++) c.pattern(b(i), '123123', 2);
        for (const i of [15, 17, 19, 21]) c.hold(b(i), 0, 4);

        // Desenvolvimento em crescendo (23–31): tercinas contínuas
        for (let i = 23; i < 32; i++) c.pattern(b(i), i % 2 ? '321321321321' : '012012012012', 1);

        // Clímax (32–39): runs descendentes fechando cada frase
        for (let i = 32; i < 40; i++) {
          if ((i - 32) % 4 === 3) {
            c.pattern(b(i), '01201201', 1);
            c.pattern(b(i) + 8, '3210', 1);
          } else {
            c.pattern(b(i), '012012012012', 1);
          }
        }

        // Recapitulação (40–51)
        for (let i = 40; i < 52; i++) c.pattern(b(i), i % 2 ? '120120' : '012012', 2);
        for (const i of [42, 44, 46, 48, 50]) { // o compasso 40 recebe boost no lugar
          c.tap(b(i) - 2, 3);
          c.tap(b(i) - 1, 3);
          c.hold(b(i), 3, 6);
        }

        // Coda (52–63): frases com respiração
        for (let i = 52; i < 64; i++) c.pattern(b(i), '012.012.012.', 1);
        for (const i of [54, 58, 62]) c.hold(b(i), 3, 6);

        // Calando (64–73)
        for (let i = 64; i < 74; i++) c.pattern(b(i), '012012', 2);
        for (const i of [65, 69]) c.hold(b(i), 3, 6);

        // Final (74–77): run + acorde sustentado
        c.pattern(b(74), '012012', 2);
        c.pattern(b(75), '012012', 2);
        c.pattern(b(76), '01233210', 1);
        c.hold(b(77), 0, 10);
        c.boost(b(77), 3);

        // Boosts nas fronteiras de frase (a cada 8 compassos)
        const boostBars = [[8, 3], [16, 0], [24, 1], [32, 2], [40, 3], [48, 1], [56, 1], [64, 2], [72, 3]];
        for (const [bar, lane] of boostBars) c.boost(b(bar), lane);

        return notes.sort((a, b2) => a.time - b2.time);
      }

      // Mickey Mouse March (Eurobeat) — 4/4 four-on-the-floor, refrão com colcheias off-beat.
      function buildMickeyChart(song) {
        const notes = [];
        const c = chartBuilderApi(song, notes);
        const b = c.bar;
        const boostHookBars = [34, 38, 42, 46, 58, 62];

        function chorusBar(i, offbeats, boost) {
          if (boost) c.boost(b(i), 0); else c.tap(b(i), 0);
          c.tap(b(i) + 1, 2);
          c.tap(b(i) + 2, 0);
          c.tap(b(i) + 3, 2);
          if (offbeats) {
            c.tap(b(i) + 0.5, 1);
            c.tap(b(i) + 2.5, 3);
          }
        }

        // Compassos 0–1: intro do áudio (sem notas — absorve a latência do player)

        // Riff de introdução (2–9)
        for (let i = 2; i < 10; i++) c.pattern(b(i), '0213', 1);

        // Verso (10–25)
        for (let i = 10; i < 26; i++) c.pattern(b(i), i % 2 ? '3132' : '0102', 1);
        for (const i of [10, 14, 18, 22]) c.hold(b(i) + 2, 1, 1); // stab de synth

        // Pré-refrão (26–33): rampa até as colcheias
        c.hold(b(26), 2, 2);
        c.tap(b(26) + 1, 0);
        c.tap(b(26) + 3, 3);
        for (let i = 27; i < 32; i++) c.pattern(b(i), '0123', 1);
        c.pattern(b(32), '0123012.', 0.5);
        c.pattern(b(33), '3210321.', 0.5);

        // Refrão (34–49)
        for (let i = 34; i < 50; i++) {
          const hasHold = i === 41 || i === 49;
          const off = (i - 34) % 2 === 1 && !hasHold;
          chorusBar(i, off, boostHookBars.indexOf(i) >= 0);
          if (hasHold) {
            c.tap(b(i) + 0.5, 1);
            c.hold(b(i), 3, 2);
          }
        }

        // Ponte em meio-tempo (50–57)
        for (let i = 50; i < 58; i++) {
          if (i % 2 === 0) {
            c.hold(b(i), 0, 2);
            c.hold(b(i) + 2, 3, 2);
          } else {
            c.tap(b(i), 1);
            c.tap(b(i) + 2, 2);
          }
        }

        // Refrão final (58–66): off-beats em todos os compassos
        for (let i = 58; i < 67; i++) chorusBar(i, true, boostHookBars.indexOf(i) >= 0);

        // Finale (67)
        c.pattern(b(67), '0123.210', 0.5);
        c.boost(b(67) + 3.5, 3);

        return notes.sort((a, b2) => a.time - b2.time);
      }

      // Paint It, Black — riff de cítara, versos alternando leve/pesado, galope de tom no fim.
      function buildPaintItBlackChart(song) {
        const notes = [];
        const c = chartBuilderApi(song, notes);
        const b = c.bar;

        function verseLight(bars, holdBars, mirror) {
          for (let i = 0; i < bars; i++) {
            if (holdBars.indexOf(i) >= 0) {
              c.tap(b(i), mirror ? 3 : 0);
              c.hold(b(i) + 1, mirror ? 0 : 3, 2);
              continue;
            }
            if (i % 2) c.pattern(b(i), mirror ? '3.1.' : '0.2.', 1);
            else c.pattern(b(i), mirror ? '2.0.' : '1.3.', 1);
            if (i === 3) c.pattern(b(i) + 2, mirror ? '3210' : '0123', 0.5);
          }
        }

        function verseHeavy(bars, holdBar) {
          for (let i = 0; i < bars; i++) {
            if (i === holdBar) { c.tap(b(i), 1); c.hold(b(i) + 1, 3, 3); continue; }
            if (i % 2 === 0) c.pattern(b(i), '00..22..', 0.5);
            else c.pattern(b(i), '1.3.', 1);
          }
        }

        // INTRO — riff de cítara sozinho, depois a banda entra
        c.section(PIB_T_INTRO, PIB_BPM);
        for (let i = 0; i < 7; i++) {
          c.pattern(b(i), '2..1..0.', 0.5);
          if (i >= 4) { c.tap(b(i), 0); c.tap(b(i) + 2, 3); }
        }

        c.section(PIB_T_V1, PIB_BPM);
        c.boost(b(0), 0);
        verseLight(14, [7, 11], false);

        c.section(PIB_T_V2, PIB_BPM);
        c.boost(b(0), 2);
        verseHeavy(15, 13);

        c.section(PIB_T_V3, PIB_BPM);
        c.boost(b(0), 1);
        verseLight(14, [7, 11], true);

        c.section(PIB_T_V4, PIB_BPM);
        c.boost(b(0), 3);
        verseHeavy(15, 13);

        c.section(PIB_T_V5, PIB_BPM);
        c.boost(b(0), 0);
        verseLight(14, [7], false);

        // BRIDGE — vocalize e galope de tom
        c.section(PIB_T_BRIDGE, PIB_BPM);
        c.boost(b(0), 2);
        for (let i = 0; i < 14; i++) {
          if (i % 2 === 0) { c.pattern(b(i), '0.00', 0.5); c.pattern(b(i) + 2, '1.11', 0.5); }
          else { c.tap(b(i), 2); c.hold(b(i) + 1, 3, 2); }
        }

        c.section(PIB_T_V6, PIB_BPM);
        c.boost(b(0), 1);
        verseHeavy(14, 13);

        // OUTRO — galope com fade
        c.section(PIB_T_OUTRO, PIB_BPM);
        c.boost(b(0), 3);
        c.boost(b(8), 1);
        for (let i = 0; i < 8; i++) {
          if (i % 2 === 0) { c.pattern(b(i), '0.00', 0.5); c.pattern(b(i) + 2, '1.11', 0.5); }
          else { c.pattern(b(i), '2.22', 0.5); c.pattern(b(i) + 2, '3.33', 0.5); }
        }
        for (let i = 8; i < 20; i++) {
          if (i === 18) { c.tap(b(i), 0); c.hold(b(i) + 1, 3, 4); continue; }
          c.pattern(b(i), '0.2.', 1);
        }
        for (let i = 20; i < 28; i++) c.tap(b(i), i % 4);

        return notes.sort((a, b2) => a.time - b2.time);
      }

      // Welcome to the Jungle — build de delay, riff, refrões "sha-na-na" e o breakdown.
      function buildJungleChart(song) {
        const notes = [];
        const c = chartBuilderApi(song, notes);
        const b = c.bar;

        function verse(mirror) {
          for (let i = 0; i < 12; i++) {
            if (i === 10) { c.tap(b(i), mirror ? 2 : 1); c.hold(b(i), mirror ? 0 : 3, 2); continue; }
            if (i % 2) c.pattern(b(i), mirror ? '3..2..1.' : '0..1..2.', 0.5);
            else { c.pattern(b(i), mirror ? '2.0.' : '1.3.', 1); c.tap(b(i) + 1.5, mirror ? 0 : 3); }
          }
        }

        function chorus(bars) {
          for (let i = 0; i < bars; i++) {
            if (i === 5 || i === 9) { c.tap(b(i), 0); c.tap(b(i) + 1, 2); c.hold(b(i) + 2, 3, 2); continue; }
            if (i === 4 || i === 8) { c.pattern(b(i), '01230123', 0.5); continue; }
            c.pattern(b(i), '0.2.1.3.', 0.5);
          }
        }

        function solo(startBar, bars) {
          for (let i = startBar; i < startBar + bars; i++) {
            if (i - startBar === 9) { c.hold(b(i), 2, 3); continue; }
            if (i % 2 === 0) c.pattern(b(i), '0123', 0.5);
            else c.pattern(b(i) + 2, '3210', 0.5);
          }
        }

        // BUILD — guitarra com delay
        c.section(JGL_T_BUILD, JGL_BPM);
        for (let i = 0; i < 6; i++) { c.tap(b(i), 3); c.tap(b(i) + 2, 2); }
        for (let i = 6; i < 10; i++) c.pattern(b(i), '3.2.1.0.', 0.5);

        // Bateria entra
        c.section(JGL_T_DRUMS, JGL_BPM);
        for (let i = 0; i < 5; i++) { c.pattern(b(i), '0..2', 1); c.tap(b(i) + 3.5, 1); }

        // RIFF principal
        c.section(JGL_T_RIFF, JGL_BPM);
        c.boost(b(0), 3);
        for (let i = 0; i < 6; i++) {
          if (i % 2 === 0) c.pattern(b(i), '00.11.22', 0.5);
          else c.pattern(b(i), '0.2.1.3.', 0.5);
        }

        c.section(JGL_T_V1, JGL_BPM);
        verse(false);

        c.section(JGL_T_CH1, JGL_BPM);
        c.boost(b(0), 2);
        chorus(10);

        c.section(JGL_T_V2, JGL_BPM);
        verse(true);

        c.section(JGL_T_CH2, JGL_BPM);
        c.boost(b(0), 3);
        chorus(10);

        c.section(JGL_T_SOLO, JGL_BPM);
        c.boost(b(0), 3);
        solo(0, 11);

        // V3 + esvaziamento
        c.section(JGL_T_V3, JGL_BPM);
        for (let i = 0; i < 9; i++) {
          if (i % 2) c.pattern(b(i), '0..1..2.', 0.5);
          else { c.pattern(b(i), '1.3.', 1); c.tap(b(i) + 1.5, 3); }
        }
        for (let i = 9; i < 13; i++) c.tap(b(i), 0);

        // BREAK — "You know where you are?!"
        c.section(JGL_T_BREAK, JGL_BPM);
        for (let i = 0; i < 6; i++) c.tap(b(i), i % 4);
        c.hold(b(6), 3, 4);
        c.boost(b(8), 0);

        // OUTRO — riff + solo final
        c.section(JGL_T_OUTRO, JGL_BPM);
        for (let i = 0; i < 16; i++) {
          if (i % 2 === 0) c.pattern(b(i), '00.11.22', 0.5);
          else c.pattern(b(i), '0.2.1.3.', 0.5);
        }
        c.boost(b(16), 2);
        solo(16, 10);
        for (let i = 26; i < 29; i++) c.pattern(b(i), '0.1.2.3.', 0.5);
        c.hold(b(29), 0, 4);

        return notes.sort((a, b2) => a.time - b2.time);
      }

      // One — arpejos limpos a 108 BPM; a seção "metralhadora" e os solos correm a 212 (multi-tempo).
      function buildOneChart(song) {
        const notes = [];
        const c = chartBuilderApi(song, notes);
        const b = c.bar;

        function slowVerse(anchor, bars, extraVoice) {
          c.section(anchor, ONE_BPM_SLOW);
          c.boost(b(0), 1);
          for (let i = 0; i < bars; i++) {
            if (i % 4 === 3) {
              c.tap(b(i), 0); c.tap(b(i) + 1, 1); c.tap(b(i) + 2, 2);
              c.pattern(b(i) + 3, '12', 0.5);
              continue;
            }
            c.pattern(b(i), '0.1.2.1.', 0.5);
            if (extraVoice && i % 2 === 0) c.tap(b(i) + 2.5, 3);
          }
        }

        function slowChorus(anchor, boostBar) {
          c.section(anchor, ONE_BPM_SLOW);
          for (const i of [0, 4, 8]) c.hold(b(i), 3, 4);
          for (const i of [1, 2, 3, 5, 6, 7, 9]) c.pattern(b(i), '0.2.', 1);
          if (boostBar != null) c.boost(b(boostBar), 1);
        }

        // INTRO — arpejos esparsos (absorve o erro de ONE_START_AT_SEC)
        c.section(0, ONE_BPM_SLOW);
        for (let i = 0; i < 16; i += 2) c.pattern(b(i), '0.1.2.1.', 0.5);

        // LEAD — melodia de guitarra sobre os arpejos
        c.section(ONE_T_LEAD, ONE_BPM_SLOW);
        for (let i = 0; i < 19; i++) {
          if (i % 2 === 0) { c.tap(b(i), 0); c.tap(b(i) + 1.5, 1); c.tap(b(i) + 3, 2); continue; }
          if (i === 7) { c.hold(b(i), 3, 3); continue; }
          if (i === 15) { c.hold(b(i), 3, 4); continue; }
          c.tap(b(i), 3); c.tap(b(i) + 2, 3);
        }

        slowVerse(ONE_T_V1, 14, false);
        slowChorus(ONE_T_CH1, null);
        slowVerse(ONE_T_V2, 18, true);
        slowChorus(ONE_T_CH2, 1);

        // HEAVY — a bateria dobra
        c.section(ONE_T_HEAVY, ONE_BPM_SLOW);
        c.boost(b(0), 1);
        for (let i = 0; i < 20; i++) {
          if (i === 18) { c.tap(b(i), 0); c.hold(b(i) + 1, 3, 4); continue; }
          if (i === 19) continue;
          c.pattern(b(i), '00.0', 0.5);
          c.pattern(b(i) + 2, '2.3.', 0.5);
        }

        // BRIDGE — "the world is gone" (respiração antes da tempestade)
        c.section(ONE_T_BRIDGE, ONE_BPM_SLOW);
        for (let i = 1; i < 9; i += 2) {
          if (i === 7) { c.hold(b(i), 3, 4); continue; }
          c.pattern(b(i), '1.2.3.', 1);
        }

        // GUNS — metralhadora em double-time
        c.section(ONE_T_GUNS, ONE_BPM_FAST);
        c.boost(b(0), 3);
        c.boost(b(16), 2);
        for (let i = 0; i < 51; i++) {
          if (i === 15 || i === 31 || i === 47) { c.pattern(b(i), '01010101', 0.5); continue; }
          c.pattern(b(i), i % 2 === 0 ? '0101' : '2323', 1);
        }

        // SOLO rápido — ciclos de 8 compassos com respiro
        c.section(ONE_T_SOLO, ONE_BPM_FAST);
        for (let i = 0; i < 66; i++) {
          const j = i % 8;
          if (i % 24 === 0) c.boost(b(i), 3);
          if (i % 16 === 15) { c.hold(b(i), 3, 2); continue; }
          if (j < 4) c.pattern(b(i), '0123', 1);
          else if (j < 6) c.pattern(b(i), '3210', 1);
          else if (j === 6) c.pattern(b(i), '0123', 0.5);
          else c.tap(b(i), 0);
        }

        // OUTRO — riff descendente e acorde final
        c.section(ONE_T_OUTRO, ONE_BPM_FAST);
        for (let i = 0; i < 24; i++) c.pattern(b(i), i % 2 === 0 ? '3210' : '2103', 1);
        for (let i = 24; i < 30; i++) c.pattern(b(i), '0.2.', 1);
        c.hold(b(30), 0, 6);
        c.boost(b(30), 3);

        return notes.sort((a, b2) => a.time - b2.time);
      }

      // Knights of Cydonia — galopes, corais, o a cappella e o riff final famoso.
      function buildCydoniaChart(song) {
        const notes = [];
        const c = chartBuilderApi(song, notes);
        const b = c.bar;

        function gallopRiff(bars, low) {
          const even = low ? '0.001.11' : '2.223.33';
          const odd = low ? '0.0.1.1.' : '2.2.3.3.';
          for (let i = 0; i < bars; i++) c.pattern(b(i), i % 2 === 0 ? even : odd, 0.5);
        }

        function verse(bars) {
          for (let i = 0; i < bars; i++) {
            if (i === 19) { c.tap(b(i), 1); c.hold(b(i) + 1, 3, 2); continue; }
            c.pattern(b(i), '1..2..3.', 0.5);
            if (i >= 12 && i % 2 === 0) c.pattern(b(i), '0.00', 0.5);
          }
          c.boost(b(12), 2);
        }

        // INTRO — galope de synth
        c.section(KOC_T_INTRO, KOC_BPM);
        for (let i = 0; i < 11; i++) {
          if (i % 2 === 0) { c.pattern(b(i), '0.00', 0.5); c.pattern(b(i) + 2, '0.00', 0.5); }
          else c.tap(b(i), 3);
        }

        c.section(KOC_T_RIFF, KOC_BPM);
        c.boost(b(0), 3);
        gallopRiff(16, true);

        // HORNS — melodia dos metais
        c.section(KOC_T_HORNS, KOC_BPM);
        for (let i = 0; i < 17; i++) {
          if (i % 2 === 0) { c.pattern(b(i), '0.00', 0.5); continue; }
          if (i === 5 || i === 13) { c.tap(b(i), 2); c.hold(b(i), 3, 3); continue; }
          c.pattern(b(i), '2.3.2.', 1);
        }

        c.section(KOC_T_V1, KOC_BPM);
        verse(21);

        c.section(KOC_T_INST, KOC_BPM);
        gallopRiff(16, false);

        c.section(KOC_T_V2, KOC_BPM);
        verse(21);

        // BUILD — arpejos e half-time pesado
        c.section(KOC_T_BUILD, KOC_BPM);
        for (let i = 0; i < 14; i++) c.pattern(b(i), '0123', 0.5);
        c.boost(b(14), 3);
        for (let i = 14; i < 26; i++) {
          if (i % 2 === 0) c.hold(b(i), 0, 2);
          else { c.tap(b(i), 2); c.tap(b(i) + 2, 3); }
        }

        // QUIET — "how can we win..."
        c.section(KOC_T_QUIET, KOC_BPM);
        for (let i = 0; i < 8; i++) c.tap(b(i), 1);

        // A CAPPELLA — "No one's gonna take me alive"
        c.section(KOC_T_ACAP, KOC_BPM);
        for (let i = 0; i < 13; i++) {
          if (i === 3 || i === 7 || i === 11) { c.hold(b(i), 3, 4); continue; }
          if (i % 2 === 0) c.pattern(b(i), '1.2.1.21', 0.5);
        }

        // RIFF FINAL — o galope famoso
        c.section(KOC_T_FINAL, KOC_BPM);
        c.boost(b(0), 2);
        c.boost(b(8), 3);
        c.boost(b(16), 2);
        c.boost(b(24), 1);
        c.boost(b(32), 2);
        for (let i = 0; i < 34; i++) {
          if (i % 4 === 3) { c.pattern(b(i), '0.1.2.3.', 0.5); continue; }
          c.pattern(b(i), i % 2 === 0 ? '0.001.11' : '2.223.33', 0.5);
        }
        c.pattern(b(34), '0123', 1);
        c.pattern(b(35), '0123', 1);
        c.hold(b(36), 0, 4);

        return notes.sort((a, b2) => a.time - b2.time);
      }

      // Through the Fire and Flames — power metal a 200 BPM. Regra de sanidade: rajadas de
      // colcheia nunca passam de 1 compasso e são sempre seguidas de compassos calmos.
      function buildTTFAFChart(song) {
        const notes = [];
        const c = chartBuilderApi(song, notes);
        const b = c.bar;

        function riff(anchor, bars) {
          c.section(anchor, TTF_BPM);
          for (let i = 0; i < bars; i++) {
            c.pattern(b(i), '0.0.2.2.', 0.5);
            if (i % 2 === 1) c.pattern(b(i) + 3, '01', 0.5);
          }
        }

        function pre(anchor) {
          c.section(anchor, TTF_BPM);
          for (let i = 0; i < 12; i++) {
            c.pattern(b(i), '0123', 1);
            if (i >= 10) c.pattern(b(i) + 3, '01', 0.5);
          }
        }

        function verse(anchor, mirror) {
          c.section(anchor, TTF_BPM);
          for (let i = 0; i < 24; i++) {
            if (i === 11 || i === 23) {
              c.tap(b(i), mirror ? 2 : 1);
              c.hold(b(i) + 1, mirror ? 0 : 3, 2);
              continue;
            }
            if (i % 2) c.pattern(b(i), mirror ? '2.1.0.' : '1.2.3.', 1);
            else c.pattern(b(i), mirror ? '3.1.' : '0.2.', 1);
          }
        }

        function chorus(anchor, bars, boosts) {
          c.section(anchor, TTF_BPM);
          for (let i = 0; i < bars; i++) {
            if (i % 8 === 7) { c.pattern(b(i), '0.1.2.', 0.5); c.hold(b(i), 3, 3); continue; }
            const boostLane = boosts[i];
            if (boostLane != null) { c.boost(b(i), boostLane); c.pattern(b(i), '..1.2.3.', 0.5); }
            else c.pattern(b(i), '0.1.2.3.', 0.5);
            if (i % 2 === 0) c.tap(b(i) + 3.5, 1);
          }
        }

        // INTRO
        c.section(TTF_T_INTRO, TTF_BPM);
        for (let i = 0; i < 6; i++) c.pattern(b(i), '0.2.', 1);
        for (let i = 6; i < 11; i++) c.pattern(b(i), '0123', 1);

        // SOLO DE INTRO — alt-picking
        c.section(TTF_T_ISOLO, TTF_BPM);
        c.boost(b(0), 3);
        for (let i = 0; i < 25; i++) {
          if (i % 4 === 3) { c.pattern(b(i), '0101', 0.5); c.pattern(b(i) + 2, '23', 1); continue; }
          c.pattern(b(i), i % 2 === 0 ? '0123' : '3210', 1);
        }

        riff(TTF_T_RIFF, 20);
        verse(TTF_T_V1, false);
        pre(TTF_T_PRE1);
        chorus(TTF_T_CH1, 26, { 0: 0, 12: 2 });
        riff(TTF_T_POST, 13);
        verse(TTF_T_V2, true);
        pre(TTF_T_PRE2);
        chorus(TTF_T_CH2, 26, { 0: 1 });

        // SEÇÃO DE SOLOS (~2 min) — 11 blocos de 8 compassos com receitas cicladas
        c.section(TTF_T_SOLO, TTF_BPM);
        for (let i = 0; i < 88; i++) {
          const block = Math.floor(i / 8);
          const j = i % 8;
          if (j === 0 && (block === 0 || block === 4 || block === 8)) c.boost(b(i), 3);
          const recipe = block % 5;
          if (recipe === 3) { // bloco-respiro com holds
            if (j === 0 || j === 4) { c.hold(b(i), 2, 3); continue; }
            c.tap(b(i), 0); c.tap(b(i) + 2, 1);
            continue;
          }
          if ((block === 5 || block === 10) && j === 7) { c.pattern(b(i), '01230123', 0.5); continue; }
          if (recipe === 0) c.pattern(b(i), '0123', 1);
          else if (recipe === 1) c.pattern(b(i), '3210', 1);
          else if (recipe === 2) {
            if (j % 2 === 0) c.pattern(b(i), '0101', 0.5);
            else c.pattern(b(i) + 2, '2323', 0.5);
          }
          else c.pattern(b(i), '0213', 1);
        }
        for (let i = 88; i < 93; i++) c.pattern(b(i), '0.2.', 1);

        // BRIDGE melódica — recuperação longa em holds
        c.section(TTF_T_BRIDGE, TTF_BPM);
        const bridgeLanes = [3, 0, 2, 1];
        for (let p = 0; p < 10; p++) {
          const lane = bridgeLanes[p % 4];
          c.hold(b(p * 2), lane, 4);
          if (p < 9) c.tap(b(p * 2 + 1) + 2, (lane + 2) % 4);
        }

        chorus(TTF_T_CH3, 32, { 0: 3, 16: 0 });

        // OUTRO
        c.section(TTF_T_OUTRO, TTF_BPM);
        for (let i = 0; i < 8; i++) c.pattern(b(i), '3210', 1);
        c.hold(b(8), 0, 8);
        c.boost(b(8), 3);

        return notes.sort((a, b2) => a.time - b2.time);
      }

      function buildRuntimeChart(rawNotes) {
        return rawNotes.map(raw => {
          const type = raw.type || 'tap';
          const duration = type === 'hold' ? Math.max(HOLD_MIN_DURATION, raw.duration || getBeatSec()) : 0;
          return {
            time: raw.time,
            lane: raw.lane,
            type,
            duration,
            endTime: raw.time + duration,
            hit: false,
            missed: false,
            quality: null,
            holdState: type === 'hold' ? 'waiting' : null,
            nextTickAt: 0,
            ticksAwarded: 0
          };
        });
      }

      // ---------- Charts externos em JSON ----------
      // Cada música pode ser configurada por charts/<id>.json com o link do YouTube,
      // as notas ([t, pista], [t, pista, "h", duração] ou [t, pista, "b"]) e o tempo.
      // O arquivo, quando existe, tem prioridade sobre o chart embutido no código.

      function parseYoutubeId(url) {
        const m = /(?:youtube\.com\/.*[?&]v=|youtu\.be\/)([\w-]{11})/.exec(url || '');
        return m ? m[1] : null;
      }

      function notesFromCompact(arr) {
        return arr.map(n => ({
          time: n[0],
          lane: n[1],
          type: n[2] === 'h' ? 'hold' : n[2] === 'b' ? 'boost' : 'tap',
          duration: n[2] === 'h' ? (n[3] || HOLD_MIN_DURATION) : 0
        }));
      }

      function notesToCompact(rawNotes) {
        return rawNotes.map(n => {
          const t = +n.time.toFixed(3);
          if (n.type === 'hold') return [t, n.lane, 'h', +(n.duration || 0).toFixed(3)];
          if (n.type === 'boost') return [t, n.lane, 'b'];
          return [t, n.lane];
        });
      }

      // Notas autoradas da música: JSON externo (se carregado) ou builder embutido
      function songChartSource(song) {
        return song.externalNotes ? notesFromCompact(song.externalNotes) : song.chartBuilder(song);
      }

      function loadExternalCharts() {
        if (location.protocol === 'file:') return; // fetch local exige http(s)
        SONGS.forEach(song => {
          fetch('charts/' + song.id + '.json')
            .then(r => (r.ok ? r.json() : null))
            .then(data => {
              if (!data || !Array.isArray(data.notes) || !data.notes.length) return;
              song.externalNotes = data.notes;
              const ytId = parseYoutubeId(data.youtube);
              if (ytId) song.youtubeId = ytId;
              for (const k of ['bpm', 'offsetMs', 'startAtSec', 'endAtSec', 'difficulty', 'minAccuracy']) {
                if (typeof data[k] === 'number') song[k] = data[k];
              }
              if (Array.isArray(data.keys) && data.keys.length >= 4) song.keys = data.keys.slice(0, 8);
            })
            .catch(() => {});
        });
      }

      function songToJson(song) {
        const meta = {
          id: song.id,
          title: song.title,
          subtitle: song.subtitle,
          artist: song.artist,
          genre: song.genre,
          genreColor: song.genreColor,
          youtube: 'https://www.youtube.com/watch?v=' + song.youtubeId,
          bpm: song.bpm,
          offsetMs: song.offsetMs + (readCalib(song.id) || 0), // exporta com a calibração ao vivo
          startAtSec: song.startAtSec,
          endAtSec: song.endAtSec,
          keys: song.keys,
          difficulty: song.difficulty,
          minAccuracy: song.minAccuracy
        };
        const notes = notesToCompact(songChartSource(song));
        return JSON.stringify(meta, null, 2).replace(/\n\}$/, ',\n  "notes": [\n    ' +
          notes.map(n => JSON.stringify(n)).join(',\n    ') + '\n  ]\n}');
      }

      function exportSongJson(song) {
        const blob = new Blob([songToJson(song)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = song.id + '.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(a.href), 5000);
        showToast(`Chart exportado: ${song.id}.json`);
      }

      // ==================== Ciclo de vida da partida ====================

      function selectedSong() {
        return discSongs(currentDisc())[state.selectIndex];
      }

      // Aterrissa a seleção no disco/linha da música dada (Q do pause, ESC do result, erro do yt)
      function landOnSong(songId) {
        const d = DISCS.findIndex(disc => disc.songIds.indexOf(songId) >= 0);
        if (d >= 0) {
          state.discIndex = d;
          state.selectIndex = DISCS[d].songIds.indexOf(songId);
          state.discAnim = null;
        }
      }

      function saveLastSelection() {
        try {
          localStorage.setItem('pianoHero.lastDisc', currentDisc().id);
          localStorage.setItem('pianoHero.lastSong', currentDisc().songIds[state.selectIndex]);
        } catch (_) {}
      }

      function restoreLastSelection() {
        try {
          const song = localStorage.getItem('pianoHero.lastSong');
          if (song && SONG_INDEX_BY_ID[song] != null) landOnSong(song);
        } catch (_) {}
      }

      function switchDisc(dir) {
        if (state.discAnim) return; // sem fila: 0,35s é curto
        state.rowByDisc[currentDisc().id] = state.selectIndex;
        const to = (state.discIndex + dir + DISCS.length) % DISCS.length;
        state.discAnim = { from: state.discIndex, to, dir, t0: nowSec() };
        state.discIndex = to;
        const remembered = state.rowByDisc[DISCS[to].id] || 0;
        state.selectIndex = Math.min(remembered, DISCS[to].songIds.length - 1);
        saveLastSelection();
        srStatus.textContent = `Disco ${to + 1} de ${DISCS.length}: ${DISCS[to].name}. ${DISCS[to].songIds.length} músicas. Use cima e baixo para escolher.`;
      }

      function moveRow(dir) {
        const max = currentDisc().songIds.length - 1;
        state.selectIndex = clamp(state.selectIndex + dir, 0, max);
        state.rowByDisc[currentDisc().id] = state.selectIndex;
        saveLastSelection();
        const song = selectedSong();
        srStatus.textContent = `${song.title}, ${song.artist}. Dificuldade ${song.difficulty} de 5.`;
      }

      function startSelectedSong() {
        startSong(SONG_INDEX_BY_ID[currentDisc().songIds[state.selectIndex]]);
      }

      function toSongSelect() {
        yt.pause();
        landOnSong(currentSong().id);
        state.screen = 'songSelect';
        srStatus.textContent = 'Seleção de músicas.';
      }

      function startSong(index) {
        const song = SONGS[index];
        if (yt.blocked[song.id]) {
          showToast('Este vídeo não permite reprodução aqui. Escolha outra música.', 3000);
          return;
        }
        if (!yt.ready) {
          state.pendingStart = index;
          showToast('Carregando player de áudio…', 2500);
          return;
        }
        setupAudio();
        state.songIndex = index;
        landOnSong(song.id);
        saveLastSelection();
        state.highScore = readHighScore(song.id);
        state.calibMs = readCalib(song.id);
        state.chart = buildRuntimeChart(songChartSource(song));
        state.chartCursor = 0;
        state.particles = [];
        state.floatingTexts = [];
        state.keysDown.clear();
        state.activeKeyFlash.clear();
        state.activeHolds.clear();
        state.holdGraceUntil = 0;
        state.score = 0;
        state.combo = 0;
        state.maxCombo = 0;
        state.accuracyPoints = 0;
        state.judgedNotes = 0;
        state.counts = { perfect: 0, great: 0, good: 0, miss: 0 };
        state.performance = 80;
        state.fever = 0;
        state.feverActive = false;
        state.feverEndsAt = 0;
        state.boostActive = false;
        state.boostEndsAt = 0;
        state.songStart = nowSec() + COUNTDOWN_SEC;
        state.totalPaused = 0;
        state.pausedAt = 0;
        state.countdown = 4;
        state.feedback = '';
        state.feedbackSub = '';
        state.resultRank = '—';
        state.resultWon = false;
        state.awaitingAudio = false;
        state.toast = null;
        clockReset();
        yt.load(song);
        state.screen = 'countdown';
        canvas.focus();
        srStatus.textContent = `Iniciando ${song.title}. Prepare-se.`;
      }

      function currentSongTime() {
        if (clock.frozen) return clock.frozenValue;
        if (clock.anchored) return clockSongTime();
        if (state.screen === 'paused') return state.pausedAt - state.songStart - state.totalPaused;
        return nowSec() - state.songStart - state.totalPaused;
      }

      function pauseGame() {
        if (state.screen === 'playing' || state.screen === 'countdown') {
          state.pausedAt = nowSec();
          state.previousScreen = state.screen;
          state.screen = 'paused';
          clockFreeze();
          yt.pause();
          if (state.audioCtx && state.audioCtx.state === 'running') state.audioCtx.suspend();
          srStatus.textContent = 'Jogo pausado.';
        } else if (state.screen === 'paused') {
          state.totalPaused += nowSec() - state.pausedAt;
          state.screen = state.previousScreen || 'playing';
          state.holdGraceUntil = nowSec() + 0.3;
          if (state.screen === 'playing' && clock.anchored) {
            yt.play(); // permanece congelado até o PLAYING real re-ancorar
          } else if (state.screen === 'countdown') {
            clock.frozen = false;
          } else {
            clock.frozen = false;
          }
          if (state.audioCtx && state.audioCtx.state === 'suspended') state.audioCtx.resume();
          srStatus.textContent = 'Jogo retomado.';
        }
      }

      function endGame(earlyLoss = false) {
        if (state.screen === 'result') return;
        finalizeActiveHolds();
        yt.pause();
        const accuracy = getAccuracy();
        state.resultWon = !earlyLoss && accuracy >= currentSong().minAccuracy;
        state.resultRank = calculateRank(accuracy);
        state.screen = 'result';
        if (state.score > state.highScore) {
          state.highScore = Math.floor(state.score);
          saveHighScore(currentSong().id, state.highScore);
        }
        srStatus.textContent = `${state.resultWon ? 'Vitória' : 'Derrota'} em ${currentSong().title}. Pontuação ${formatScore(state.score)}. Precisão ${Math.round(accuracy * 100)} por cento.`;
      }

      function getAccuracy() {
        return state.judgedNotes > 0 ? state.accuracyPoints / state.judgedNotes : 0;
      }

      function calculateRank(a) {
        if (a >= 0.99) return 'S+';
        if (a >= 0.95) return 'S';
        if (a >= 0.9) return 'A';
        if (a >= 0.8) return 'B';
        if (a >= 0.7) return 'C';
        return 'D';
      }

      function comboMultiplier() {
        if (state.combo >= 100) return 2.5;
        if (state.combo >= 50) return 2;
        if (state.combo >= 25) return 1.5;
        if (state.combo >= 10) return 1.25;
        return 1;
      }

      function boostMult() { return state.boostActive ? BOOST_MULT : 1; }

      function totalMultiplier() {
        return comboMultiplier() * (state.feverActive ? 2 : 1) * boostMult();
      }

      // ==================== Julgamento ====================

      function registerHit(note, quality, delta) {
        note.hit = true;
        note.quality = quality;
        const values = {
          perfect: { factor: 1, perf: 1.35, fever: 7.5, label: 'PERFECT' },
          great: { factor: 0.8, perf: 0.85, fever: 5.2, label: 'GREAT' },
          good: { factor: 0.5, perf: 0.35, fever: 2.8, label: 'GOOD' }
        };
        const info = values[quality];
        if (note.type === 'boost') activateBoost(); // a própria nota já recebe o ×2
        const gained = 100 * info.factor * totalMultiplier();
        state.score += gained;
        state.combo += 1;
        state.maxCombo = Math.max(state.maxCombo, state.combo);
        state.accuracyPoints += info.factor;
        state.judgedNotes += 1;
        state.counts[quality] += 1;
        state.performance = clamp(state.performance + info.perf, 0, 100);
        if (!state.feverActive) state.fever = clamp(state.fever + info.fever, 0, 100);
        state.feedback = info.label;
        state.feedbackSub = Math.abs(delta) < 0.018 ? 'ON BEAT' : delta < 0 ? 'EARLY' : 'LATE';
        state.feedbackAt = nowSec();
        state.pulse = 1;
        state.activeKeyFlash.set(note.lane, 1);
        spawnHitParticles(note.lane, quality);
        state.floatingTexts.push({ text: `+${Math.round(gained)}`, lane: note.lane, born: nowSec(), life: 0.75, quality: note.type === 'boost' ? 'boost' : quality });
        playHitSound(note.lane, quality);
      }

      function registerMiss(note, reason = 'MISS') {
        if (note && !note.hit && !note.missed) note.missed = true;
        state.combo = 0;
        state.judgedNotes += 1;
        state.counts.miss += 1;
        state.performance = clamp(state.performance - 7.5, 0, 100);
        if (!state.feverActive) state.fever = clamp(state.fever - 12, 0, 100);
        state.feedback = reason;
        state.feedbackSub = reason === 'MISS' ? 'NOTA PERDIDA' : 'TECLA EXTRA';
        state.feedbackAt = nowSec();
        state.shake = 1;
        playMissSound();
        if (state.performance <= 0) endGame(true);
      }

      function pressLane(lane) {
        if (state.screen !== 'playing') return;
        if (state.activeHolds.has(lane)) return; // re-press durante hold ativo: sem penalidade
        const t = currentSongTime();
        let best = null;
        let bestAbs = Infinity;
        for (let i = state.chartCursor; i < state.chart.length; i++) {
          const note = state.chart[i];
          if (note.time > t + WINDOWS.miss) break;
          if (note.lane !== lane || note.hit || note.missed) continue;
          const delta = t - note.time;
          const abs = Math.abs(delta);
          if (abs < bestAbs) {
            best = note;
            bestAbs = abs;
          }
        }

        if (!best || bestAbs > WINDOWS.good) {
          state.activeKeyFlash.set(lane, 0.5);
          state.performance = clamp(state.performance - 1.25, 0, 100);
          state.feedback = 'OFF BEAT';
          state.feedbackSub = 'SEM NOTA';
          state.feedbackAt = nowSec();
          state.shake = Math.max(state.shake, 0.25);
          playMissSound();
          if (state.performance <= 0) endGame(true);
          return;
        }

        const delta = t - best.time;
        let quality = 'good';
        if (bestAbs <= WINDOWS.perfect) quality = 'perfect';
        else if (bestAbs <= WINDOWS.great) quality = 'great';

        if (best.type === 'hold') startHold(best, quality, delta, t);
        else registerHit(best, quality, delta);
      }

      function startHold(note, quality, delta, t) {
        registerHit(note, quality, delta);
        note.holdState = 'active';
        const tick = HOLD_TICK_BEATS * getBeatSec();
        // Agenda ticks na grade da própria nota, pulando os que já passaram (sem rajada grátis)
        note.nextTickAt = note.time + tick * (Math.floor(Math.max(0, t - note.time) / tick) + 1);
        state.activeHolds.set(note.lane, note);
      }

      function awardHoldTick(note) {
        const gained = HOLD_TICK_BASE * totalMultiplier();
        state.score += gained;
        note.ticksAwarded += 1;
        if (!state.feverActive) state.fever = clamp(state.fever + 0.6, 0, 100);
        spawnHoldTickParticles(note.lane);
        if (note.ticksAwarded % 2 === 0) {
          const scale = [261.63, 293.66, 329.63, 349.23];
          playTone(scale[note.lane % scale.length] * 2, 0.05, 0.05, 'sine');
        }
      }

      function completeHold(note) {
        note.holdState = 'completed';
        state.activeHolds.delete(note.lane);
        const bonus = HOLD_COMPLETE_BASE * totalMultiplier();
        state.score += bonus;
        state.combo += 1;
        state.maxCombo = Math.max(state.maxCombo, state.combo);
        state.performance = clamp(state.performance + 1.5, 0, 100);
        if (!state.feverActive) state.fever = clamp(state.fever + 4, 0, 100);
        state.feedback = 'HOLD!';
        state.feedbackSub = 'SUSTENTADO ATÉ O FIM';
        state.feedbackAt = nowSec();
        state.pulse = Math.max(state.pulse, 0.8);
        state.floatingTexts.push({ text: `+${Math.round(bonus)} SEGUROU!`, lane: note.lane, born: nowSec(), life: 0.85, quality: 'hold' });
        spawnHitParticles(note.lane, 'perfect');
        playTone(659.25, 0.2, 0.12, 'triangle');
        playTone(1318.5, 0.26, 0.07, 'sine');
      }

      function breakHold(note) {
        note.holdState = 'broken';
        state.activeHolds.delete(note.lane);
        state.combo = 0;
        state.performance = clamp(state.performance - 4, 0, 100);
        if (!state.feverActive) state.fever = clamp(state.fever - 6, 0, 100);
        state.feedback = 'QUEBROU';
        state.feedbackSub = 'SOLTOU CEDO';
        state.feedbackAt = nowSec();
        state.shake = 0.5;
        playMissSound();
        if (state.performance <= 0) endGame(true);
      }

      function releaseLane(lane) {
        if (state.screen !== 'playing') return;
        const note = state.activeHolds.get(lane);
        if (!note) return;
        const t = currentSongTime();
        if (t >= note.endTime - HOLD_RELEASE_TOL) completeHold(note);
        else breakHold(note);
      }

      function finalizeActiveHolds() {
        for (const note of Array.from(state.activeHolds.values())) {
          completeHold(note); // o jogador segurou até o fim da música
        }
      }

      function updateHolds(t) {
        for (const [lane, note] of Array.from(state.activeHolds.entries())) {
          const key = currentSong().keys[lane];
          const stillDown = state.keysDown.has(key);
          if (!stillDown && nowSec() > state.holdGraceUntil) {
            // Poll de segurança (keyup é o gatilho primário; cobre blur/casos perdidos)
            if (t >= note.endTime - HOLD_RELEASE_TOL) completeHold(note);
            else breakHold(note);
            continue;
          }
          while (note.nextTickAt <= t && note.nextTickAt <= note.endTime) {
            awardHoldTick(note);
            note.nextTickAt += HOLD_TICK_BEATS * getBeatSec();
          }
          if (t >= note.endTime) completeHold(note);
        }
      }

      function activateFever() {
        if (state.screen !== 'playing' || state.feverActive || state.fever < 100) return;
        state.feverActive = true;
        state.feverEndsAt = currentSongTime() + state.feverDuration;
        state.feedback = 'FEVER';
        state.feedbackSub = 'MULTIPLICADOR ×2';
        state.feedbackAt = nowSec();
        state.pulse = 1.5;
        for (let i = 0; i < 36; i++) spawnFeverParticle();
        playTone(523.25, 0.28, 0.18, 'sawtooth');
        playTone(659.25, 0.32, 0.12, 'triangle');
        playTone(783.99, 0.38, 0.1, 'sine');
      }

      function activateBoost() {
        state.boostActive = true;
        state.boostEndsAt = currentSongTime() + BOOST_DURATION; // re-hit renova, não empilha
        state.feedback = 'BOOST';
        state.feedbackSub = `MULTIPLICADOR ×2 · ${BOOST_DURATION}s`;
        state.feedbackAt = nowSec();
        state.pulse = 1.2;
        for (let i = 0; i < 24; i++) spawnBoostParticle();
        playTone(659.25, 0.22, 0.16, 'square');
        playTone(1318.5, 0.3, 0.09, 'sine');
      }

      function spawnHitParticles(lane, quality) {
        const colors = quality === 'perfect' ? ['#ffffff', '#ffd76a', '#75e6ff'] : quality === 'great' ? ['#d8a9ff', '#ffffff'] : ['#ffd78f'];
        const geo = trackGeometry();
        const x = laneCenterAt(lane, 1, geo);
        for (let i = 0; i < (quality === 'perfect' ? 16 : 10); i++) {
          if (state.particles.length >= PARTICLE_CAP) return;
          state.particles.push({
            x,
            y: geo.targetY,
            vx: (Math.random() - 0.5) * 250,
            vy: -80 - Math.random() * 240,
            gravity: 360,
            size: 2 + Math.random() * 5,
            born: nowSec(),
            life: 0.45 + Math.random() * 0.4,
            color: colors[Math.floor(Math.random() * colors.length)],
            alpha: 1
          });
        }
      }

      function spawnHoldTickParticles(lane) {
        const geo = trackGeometry();
        const palette = lanePalette[lane % lanePalette.length];
        const x = laneCenterAt(lane, 1, geo);
        for (let i = 0; i < 3; i++) {
          if (state.particles.length >= PARTICLE_CAP) return;
          state.particles.push({
            x: x + (Math.random() - 0.5) * 26,
            y: geo.targetY,
            vx: (Math.random() - 0.5) * 90,
            vy: -60 - Math.random() * 130,
            gravity: 220,
            size: 1.5 + Math.random() * 3,
            born: nowSec(),
            life: 0.3 + Math.random() * 0.3,
            color: Math.random() < 0.5 ? palette.light : '#ffffff',
            alpha: 0.9
          });
        }
      }

      function spawnFeverParticle() {
        if (state.particles.length >= PARTICLE_CAP) return;
        state.particles.push({
          x: 430 + Math.random() * 800,
          y: 780 + Math.random() * 100,
          vx: (Math.random() - 0.5) * 70,
          vy: -150 - Math.random() * 320,
          gravity: -10,
          size: 2 + Math.random() * 4,
          born: nowSec(),
          life: 0.8 + Math.random() * 1.2,
          color: Math.random() < 0.5 ? '#ffd65a' : '#b987ff',
          alpha: 0.8
        });
      }

      function spawnBoostParticle() {
        if (state.particles.length >= PARTICLE_CAP) return;
        state.particles.push({
          x: 430 + Math.random() * 800,
          y: 780 + Math.random() * 100,
          vx: (Math.random() - 0.5) * 70,
          vy: -150 - Math.random() * 320,
          gravity: -10,
          size: 2 + Math.random() * 4,
          born: nowSec(),
          life: 0.8 + Math.random() * 1.2,
          color: Math.random() < 0.5 ? '#8ff7ff' : '#0090ff',
          alpha: 0.8
        });
      }

      // ==================== Update ====================

      function update(dt) {
        state.pulse = Math.max(0, state.pulse - dt * 3.7);
        state.shake = Math.max(0, state.shake - dt * 4.8);
        for (const [lane, v] of state.activeKeyFlash.entries()) {
          const next = v - dt * 3.8;
          if (next <= 0) state.activeKeyFlash.delete(lane);
          else state.activeKeyFlash.set(lane, next);
        }

        const now = nowSec();
        state.particles = state.particles.filter(p => now - p.born < p.life);
        state.floatingTexts = state.floatingTexts.filter(p => now - p.born < p.life);

        if (state.screen === 'countdown') {
          const remaining = -currentSongTime();
          const value = Math.ceil(remaining);
          if (value !== state.countdown) {
            state.countdown = value;
            if (value > 0) playBeatSound(true);
          }
          if (remaining <= 0) {
            state.screen = 'playing';
            yt.play();
            srStatus.textContent = 'Valendo.';
          }
          return;
        }

        if (state.screen !== 'playing') return;

        clockUpdate();
        const t = currentSongTime();

        // UX de buffering / bloqueio de autoplay
        if (state.awaitingAudio) {
          showToast('Clique na tela para liberar o áudio', 600);
        } else if (clock.frozen && now - clock.frozenAtPerf > 0.4) {
          showToast('CARREGANDO ÁUDIO…', 600);
        }
        if (!clock.anchored && !clock.frozen && t > 1.5) {
          clock.frozenValue = 0;
          clock.frozen = true;
          clock.frozenAtPerf = now;
          state.awaitingAudio = true;
        }

        if (state.feverActive) {
          const remaining = state.feverEndsAt - t;
          state.fever = clamp((remaining / state.feverDuration) * 100, 0, 100);
          if (remaining <= 0) {
            state.feverActive = false;
            state.fever = 0;
          } else if (Math.random() < dt * 13) {
            spawnFeverParticle();
          }
        }

        if (state.boostActive) {
          if (t >= state.boostEndsAt) state.boostActive = false;
          else if (Math.random() < dt * 6) spawnBoostParticle();
        }

        updateHolds(t);

        // Varredura de miss a partir do cursor (O(visível), não O(n))
        for (let i = state.chartCursor; i < state.chart.length; i++) {
          const note = state.chart[i];
          if (note.time > t - WINDOWS.miss) break;
          if (!note.hit && !note.missed) {
            registerMiss(note);
            if (note.type === 'hold') note.holdState = 'missed';
          }
        }
        while (state.chartCursor < state.chart.length) {
          const n = state.chart[state.chartCursor];
          if ((n.hit || n.missed) && t > n.endTime + 1) state.chartCursor++;
          else break;
        }

        if (t >= songLength(currentSong())) endGame(false);
      }

      // ==================== Geometria ====================

      function trackGeometry() {
        const keys = currentSong().keys;
        return {
          x: 505,
          topY: 180,
          bottomY: 720,
          targetY: 665,
          topW: keys.length === 4 ? 320 : 395,
          bottomW: keys.length === 4 ? 700 : 790,
          lanes: keys.length
        };
      }

      function trackBoundsAt(progress, geo) {
        const width = lerp(geo.topW, geo.bottomW, progress);
        return { left: 885 - width / 2, width };
      }

      function laneCenterAt(lane, progress, geo) {
        const bounds = trackBoundsAt(progress, geo);
        return bounds.left + bounds.width * ((lane + 0.5) / geo.lanes);
      }

      // ==================== Draw ====================

      const uiButtons = [];
      function uiButton(id, x, y, w, h) { uiButtons.push({ id, x, y, w, h }); }

      function draw() {
        uiButtons.length = 0;
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.fillStyle = '#080909';
        ctx.fillRect(0, 0, state.viewW, state.viewH);
        beginScene();

        const shakeX = state.shake ? (Math.random() - 0.5) * 8 * state.shake : 0;
        const shakeY = state.shake ? (Math.random() - 0.5) * 5 * state.shake : 0;
        ctx.save();
        ctx.translate(shakeX, shakeY);

        drawStageBackground();

        if (state.screen === 'title') {
          drawTitle();
        } else if (state.screen === 'songSelect') {
          drawSongSelect();
        } else {
          drawGameScene();
          if (state.screen === 'paused') drawPauseOverlay();
          if (state.screen === 'result') drawResultOverlay();
          if (state.screen === 'countdown') drawCountdown();
        }

        drawToast();
        ctx.restore();
        endScene();
      }

      function drawStageBackground() {
        const feverGlow = state.feverActive ? 0.24 : 0;
        const bg = ctx.createLinearGradient(0, 0, 0, DESIGN_H);
        bg.addColorStop(0, state.feverActive ? '#4b2b4f' : '#53402d');
        bg.addColorStop(0.55, state.feverActive ? '#2a172e' : '#2b251d');
        bg.addColorStop(1, '#080b0c');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, DESIGN_W, DESIGN_H);

        const radial = ctx.createRadialGradient(860, 280, 50, 860, 340, 690);
        radial.addColorStop(0, `rgba(255,214,139,${0.24 + feverGlow})`);
        radial.addColorStop(0.45, `rgba(178,123,65,${0.13 + feverGlow * 0.5})`);
        radial.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = radial;
        ctx.fillRect(0, 0, DESIGN_W, DESIGN_H);

        drawSpotlight(565, 65, 430, 760, 'rgba(255,215,154,.13)');
        drawSpotlight(1050, 65, 1150, 760, state.feverActive ? 'rgba(196,122,255,.18)' : state.boostActive ? 'rgba(0,190,255,.16)' : 'rgba(255,215,154,.12)');
        drawSpotlight(800, 50, 760, 690, 'rgba(255,241,200,.10)');

        // Industrial stage silhouettes
        ctx.save();
        ctx.globalAlpha = 0.3;
        ctx.fillStyle = '#111516';
        for (let i = 0; i < 10; i++) {
          const x = i * 170 + (i % 2) * 40;
          const h = 100 + (i % 4) * 38;
          ctx.fillRect(x, 260 - h, 72, h);
          ctx.fillRect(x + 14, 270 - h, 9, h + 100);
          ctx.fillRect(x + 50, 250 - h, 8, h + 90);
        }
        ctx.restore();

        drawScaffolding(1310, 155, 250, 330);
        drawScaffolding(35, 210, 210, 280);
        drawPianoSilhouette(385, 505, 0.82);
        drawCrowd();

        // Soft vignette
        const vg = ctx.createRadialGradient(800, 420, 220, 800, 430, 900);
        vg.addColorStop(0.55, 'rgba(0,0,0,0)');
        vg.addColorStop(1, 'rgba(0,0,0,.68)');
        ctx.fillStyle = vg;
        ctx.fillRect(0, 0, DESIGN_W, DESIGN_H);
      }

      function drawSpotlight(x1, y1, x2, y2, color) {
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(x1 - 22, y1);
        ctx.lineTo(x2 - 135, y2);
        ctx.lineTo(x2 + 135, y2);
        ctx.lineTo(x1 + 22, y1);
        ctx.closePath();
        const g = ctx.createLinearGradient(x1, y1, x2, y2);
        g.addColorStop(0, color);
        g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = g;
        ctx.fill();
        ctx.restore();
      }

      function drawScaffolding(x, y, w, h) {
        ctx.save();
        ctx.strokeStyle = 'rgba(10,12,12,.48)';
        ctx.lineWidth = 8;
        ctx.strokeRect(x, y, w, h);
        for (let i = 1; i < 4; i++) {
          const yy = y + (h / 4) * i;
          ctx.beginPath(); ctx.moveTo(x, yy); ctx.lineTo(x + w, yy); ctx.stroke();
        }
        for (let i = 1; i < 3; i++) {
          const xx = x + (w / 3) * i;
          ctx.beginPath(); ctx.moveTo(xx, y); ctx.lineTo(xx, y + h); ctx.stroke();
        }
        ctx.lineWidth = 5;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + w, y + h); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x + w, y); ctx.lineTo(x, y + h); ctx.stroke();
        ctx.restore();
      }

      function drawPianoSilhouette(x, y, s) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(s, s);
        ctx.fillStyle = '#080b0c';
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(112, -10);
        ctx.quadraticCurveTo(170, -30, 195, -70);
        ctx.lineTo(202, -105);
        ctx.quadraticCurveTo(156, -92, 120, -103);
        ctx.quadraticCurveTo(78, -116, 40, -76);
        ctx.closePath();
        ctx.fill();
        ctx.fillRect(10, 0, 190, 15);
        ctx.fillRect(28, 10, 12, 88);
        ctx.fillRect(165, 10, 12, 88);
        ctx.fillRect(72, 18, 48, 8);
        ctx.fillRect(86, 26, 9, 70);
        ctx.beginPath();
        ctx.moveTo(58, -88); ctx.lineTo(152, -160); ctx.lineTo(169, -152); ctx.lineTo(117, -98); ctx.closePath(); ctx.fill();
        ctx.restore();
      }

      function drawCrowd() {
        ctx.save();
        const seed = seededRandom(2284);
        for (let row = 0; row < 3; row++) {
          const count = 22 + row * 6;
          const y = 610 + row * 72;
          const scale = 0.75 + row * 0.18;
          for (let i = 0; i < count; i++) {
            const x = (i / (count - 1)) * 1660 - 30 + (seed() - 0.5) * 35;
            const bob = Math.sin(nowSec() * 2 + i * 0.8) * 3;
            drawPerson(x, y + bob, scale, seed() > 0.6, seed());
          }
        }
        ctx.restore();
      }

      function drawPerson(x, y, s, raised, variation) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(s, s);
        ctx.fillStyle = variation > 0.5 ? '#0a0e0f' : '#0d1112';
        ctx.beginPath(); ctx.arc(0, -42, 15, 0, TWO_PI); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(-24, -25); ctx.quadraticCurveTo(0, -40, 24, -25); ctx.lineTo(35, 42); ctx.lineTo(-35, 42); ctx.closePath(); ctx.fill();
        if (raised) {
          const wave = Math.sin(nowSec() * 2.5 + x * 0.01) * 5;
          ctx.lineWidth = 10;
          ctx.lineCap = 'round';
          ctx.strokeStyle = ctx.fillStyle;
          ctx.beginPath(); ctx.moveTo(-18, -14); ctx.lineTo(-30, -58); ctx.lineTo(-20 + wave, -94); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(18, -14); ctx.lineTo(34, -54); ctx.lineTo(28 - wave, -88); ctx.stroke();
        }
        ctx.restore();
      }

      function drawLogo(centerX = 880, y = 60, scale = 1) {
        ctx.save();
        ctx.translate(centerX, y);
        ctx.scale(scale, scale);
        ctx.rotate(-0.018);
        ctx.shadowColor = 'rgba(0,0,0,.65)';
        ctx.shadowBlur = 0;
        ctx.shadowOffsetX = 14;
        ctx.shadowOffsetY = 14;
        ctx.fillStyle = '#0b0e0f';
        ctx.fillRect(-255, 15, 520, 112);
        ctx.shadowColor = 'transparent';
        ctx.fillStyle = '#f2f0e8';
        ctx.beginPath();
        ctx.moveTo(-275, 0); ctx.lineTo(270, -10); ctx.lineTo(255, 110); ctx.lineTo(-290, 120); ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,.5)';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = '#101314';
        ctx.font = '900 74px Impact, Arial Black, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('PIANO HERO', -10, 57);

        // crown / piano bars
        ctx.fillStyle = '#15191b';
        ctx.beginPath();
        ctx.moveTo(-54, -20); ctx.lineTo(36, -24); ctx.lineTo(45, 10); ctx.lineTo(-62, 14); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#f0ad3e';
        for (let i = 0; i < 4; i++) {
          const h = [32, 45, 39, 31][i];
          fillRoundRect(-39 + i * 20, -13 - h, 10, h, 3, '#f0ad3e');
        }
        ctx.restore();
      }

      // ---------- Tela de título (estilo Rock Band) ----------

      function drawTitle() {
        const pulse = 0.5 + 0.5 * Math.sin(nowSec() * 2.4);

        // Glow dourado pulsante atrás do logo
        const glow = ctx.createRadialGradient(800, 300, 60, 800, 300, 430);
        glow.addColorStop(0, `rgba(242,173,59,${0.08 + 0.07 * pulse})`);
        glow.addColorStop(1, 'rgba(242,173,59,0)');
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, DESIGN_W, DESIGN_H);

        drawLogo(800, 190, 1.7);

        ctx.textAlign = 'center';
        ctx.textBaseline = 'alphabetic';
        ctx.fillStyle = 'rgba(255,255,255,.6)';
        ctx.font = '800 19px Arial, sans-serif';
        ctx.fillText('UM TRIBUTO AO RITMO', 800, 470);

        uiButton('title-start', 540, 600, 520, 74);
        if (state.hoverTarget === 'title-start') strokeRoundRect(540, 600, 520, 74, 16, '#f1ad3b', 2);
        ctx.save();
        ctx.shadowColor = '#f2ad3b';
        ctx.shadowBlur = 16 * pulse;
        ctx.fillStyle = `rgba(242,173,59,${0.45 + 0.55 * pulse})`;
        ctx.font = '900 38px Arial Black, sans-serif';
        ctx.fillText('PRESSIONE ENTER', 800, 645);
        ctx.restore();

        if (location.protocol === 'file:') {
          ctx.fillStyle = '#e45460';
          ctx.font = '700 14px Arial, sans-serif';
          ctx.fillText('Sirva o jogo via http(s) para ouvir as músicas do YouTube', 800, 795);
        }

        ctx.fillStyle = 'rgba(255,255,255,.52)';
        ctx.font = '600 14px Arial, sans-serif';
        ctx.fillText('ENTER para começar  •  MÚSICA via YouTube  •  ⛶ tela cheia', 800, 830);
      }

      // ---------- Seleção de música (estilo Guitar Hero) ----------

      function coverSeed(songId) {
        let h = 7;
        for (const ch of songId) h = (h * 31 + ch.charCodeAt(0)) | 0;
        return seededRandom(h >>> 0);
      }

      function drawCover(x, y, w, h, style, songId) {
        const g = ctx.createLinearGradient(x, y, x + w, y + h);
        g.addColorStop(0, style.bg1);
        g.addColorStop(1, style.bg2);
        fillRoundRect(x, y, w, h, 6, g);
        ctx.save();
        roundRectPath(ctx, x, y, w, h, 6);
        ctx.clip();
        const seed = coverSeed(songId);
        if (style.motif === 'blackdoor') {
          // vinheta lateral
          ctx.fillStyle = 'rgba(0,0,0,.5)';
          ctx.fillRect(x, y, w * 0.16, h);
          ctx.fillRect(x + w * 0.84, y, w * 0.16, h);
          // porta vermelha
          fillRoundRect(x + w * 0.3, y + h * 0.18, w * 0.4, h * 0.82, 4, style.accent);
          ctx.fillStyle = style.bg1;
          ctx.fillRect(x + w * 0.36, y + h * 0.26, w * 0.28, h * 0.26);
          ctx.fillRect(x + w * 0.36, y + h * 0.58, w * 0.28, h * 0.3);
          ctx.fillStyle = '#f2eee5';
          ctx.beginPath(); ctx.arc(x + w * 0.65, y + h * 0.55, Math.max(1.5, w * 0.02), 0, TWO_PI); ctx.fill();
        } else if (style.motif === 'jungle') {
          // folhas em arcos grossos saindo dos cantos inferiores
          ctx.lineCap = 'round';
          for (let i = 0; i < 6; i++) {
            ctx.strokeStyle = style.accent;
            ctx.globalAlpha = 0.3 + seed() * 0.5;
            ctx.lineWidth = Math.max(3, w * (0.04 + seed() * 0.03));
            const fromLeft = i % 2 === 0;
            const bx = fromLeft ? x - w * 0.05 : x + w * 1.05;
            const tipX = x + w * (0.25 + seed() * 0.5);
            const tipY = y + h * (0.15 + seed() * 0.45);
            ctx.beginPath();
            ctx.moveTo(bx, y + h * 1.02);
            ctx.quadraticCurveTo(fromLeft ? x + w * 0.15 : x + w * 0.85, y + h * 0.65, tipX, tipY);
            ctx.stroke();
          }
          ctx.globalAlpha = 1;
          // letreiro neon
          ctx.save();
          ctx.shadowColor = style.accent;
          ctx.shadowBlur = 8;
          strokeRoundRect(x + w * 0.28, y + h * 0.3, w * 0.44, h * 0.18, 4, style.accent, Math.max(1.5, w * 0.015));
          ctx.restore();
        } else if (style.motif === 'one') {
          // arame farpado
          ctx.strokeStyle = style.accent;
          ctx.lineWidth = Math.max(1.5, w * 0.012);
          for (const fy of [0.35, 0.6]) {
            const yy = y + h * fy;
            ctx.beginPath(); ctx.moveTo(x, yy); ctx.lineTo(x + w, yy); ctx.stroke();
            for (let i = 1; i < 6; i++) {
              const xx = x + (w / 6) * i;
              const s = Math.max(2.5, w * 0.025);
              ctx.beginPath();
              ctx.moveTo(xx - s, yy - s); ctx.lineTo(xx + s, yy + s);
              ctx.moveTo(xx + s, yy - s); ctx.lineTo(xx - s, yy + s);
              ctx.stroke();
            }
          }
          // dog tags
          ctx.save();
          ctx.translate(x + w * 0.5, y + h * 0.8);
          ctx.rotate(-0.12);
          fillRoundRect(-w * 0.11, -h * 0.09, w * 0.14, h * 0.18, w * 0.04, '#b9bfc9');
          ctx.rotate(0.22);
          fillRoundRect(-w * 0.02, -h * 0.1, w * 0.14, h * 0.18, w * 0.04, '#8f959e');
          ctx.restore();
        } else if (style.motif === 'cydonia') {
          // sol
          ctx.globalAlpha = 0.9;
          ctx.fillStyle = style.accent;
          ctx.beginPath(); ctx.arc(x + w * 0.5, y + h * 0.42, w * 0.28, 0, TWO_PI); ctx.fill();
          ctx.globalAlpha = 1;
          // horizonte
          ctx.fillStyle = '#140a08';
          ctx.fillRect(x, y + h * 0.68, w, h * 0.32);
          // cavaleiro (silhueta mínima)
          ctx.fillStyle = '#0b0705';
          const cx = x + w * 0.5, hy = y + h * 0.68;
          ctx.beginPath(); ctx.ellipse(cx, hy - h * 0.055, w * 0.1, h * 0.045, 0, 0, TWO_PI); ctx.fill();
          ctx.lineWidth = Math.max(1.5, w * 0.015);
          ctx.strokeStyle = '#0b0705';
          for (const dx of [-0.07, -0.03, 0.03, 0.07]) {
            ctx.beginPath(); ctx.moveTo(cx + w * dx, hy - h * 0.03); ctx.lineTo(cx + w * (dx + 0.015), hy); ctx.stroke();
          }
          ctx.beginPath();
          ctx.moveTo(cx - w * 0.01, hy - h * 0.09);
          ctx.lineTo(cx + w * 0.05, hy - h * 0.19);
          ctx.lineTo(cx + w * 0.07, hy - h * 0.08);
          ctx.closePath(); ctx.fill();
        } else if (style.motif === 'fireflames') {
          // camadas de chamas
          const layers = [
            { top: 0.75, alpha: 0.85, color: style.accent },
            { top: 0.6, alpha: 0.55, color: style.accent },
            { top: 0.45, alpha: 0.35, color: style.accent }
          ];
          for (const L of layers) {
            ctx.globalAlpha = L.alpha;
            ctx.fillStyle = L.color;
            ctx.beginPath();
            ctx.moveTo(x, y + h);
            for (let i = 0; i <= 6; i++) {
              const px = x + (w / 6) * i;
              const peak = y + h * (L.top - (i % 2 === 0 ? 0 : 0.12) - seed() * 0.06);
              ctx.quadraticCurveTo(px - w / 12, y + h * (L.top + 0.12), px, peak);
            }
            ctx.lineTo(x + w, y + h);
            ctx.closePath();
            ctx.fill();
          }
          // núcleo quente
          ctx.globalAlpha = 0.9;
          ctx.fillStyle = '#fff3d0';
          ctx.beginPath();
          ctx.moveTo(x + w * 0.3, y + h);
          ctx.quadraticCurveTo(x + w * 0.5, y + h * 0.72, x + w * 0.7, y + h);
          ctx.closePath(); ctx.fill();
          ctx.globalAlpha = 1;
          // faíscas
          ctx.fillStyle = '#ffd9a0';
          for (let i = 0; i < 8; i++) {
            ctx.globalAlpha = 0.4 + seed() * 0.5;
            ctx.beginPath(); ctx.arc(x + seed() * w, y + h * (0.1 + seed() * 0.5), 0.8 + seed() * 1.4, 0, TWO_PI); ctx.fill();
          }
          ctx.globalAlpha = 1;
        } else if (style.motif === 'moon') {
          ctx.fillStyle = style.accent;
          ctx.globalAlpha = 0.85;
          ctx.beginPath(); ctx.arc(x + w * 0.68, y + h * 0.32, w * 0.2, 0, TWO_PI); ctx.fill();
          ctx.globalAlpha = 1;
          ctx.fillStyle = style.bg1;
