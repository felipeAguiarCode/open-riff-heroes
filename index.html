      function formatTime(sec) {
        sec = Math.max(0, Math.floor(sec));
        return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
      }

      function drawTrack(geo) {
        const top = trackBoundsAt(0, geo);
        const bottom = trackBoundsAt(1, geo);

        ctx.save();
        ctx.shadowColor = 'rgba(0,0,0,.7)';
        ctx.shadowBlur = 35;
        ctx.shadowOffsetY = 16;
        ctx.beginPath();
        ctx.moveTo(top.left - 15, geo.topY);
        ctx.lineTo(top.left + top.width + 15, geo.topY);
        ctx.lineTo(bottom.left + bottom.width + 22, geo.bottomY);
        ctx.lineTo(bottom.left - 22, geo.bottomY);
        ctx.closePath();
        ctx.fillStyle = '#111617';
        ctx.fill();
        ctx.restore();

        const tg = ctx.createLinearGradient(0, geo.topY, 0, geo.bottomY);
        tg.addColorStop(0, '#111516');
        tg.addColorStop(0.65, '#0e1314');
        tg.addColorStop(1, '#111718');
        ctx.beginPath();
        ctx.moveTo(top.left, geo.topY);
        ctx.lineTo(top.left + top.width, geo.topY);
        ctx.lineTo(bottom.left + bottom.width, geo.bottomY);
        ctx.lineTo(bottom.left, geo.bottomY);
        ctx.closePath();
        ctx.fillStyle = tg;
        ctx.fill();

        // Borda (azulada durante o boost)
        ctx.strokeStyle = state.boostActive ? '#bfefff' : '#ece8df';
        ctx.lineWidth = 8;
        ctx.lineJoin = 'round';
        ctx.stroke();

        // Separadores neon: glow falso em duas passadas (sem shadowBlur — barato)
        for (let i = 1; i < geo.lanes; i++) {
          const topX = top.left + top.width * (i / geo.lanes);
          const bottomX = bottom.left + bottom.width * (i / geo.lanes);
          const palette = lanePalette[Math.min(i - 1, lanePalette.length - 1)];

          ctx.strokeStyle = palette.main;
          ctx.globalAlpha = 0.18 * neonPulse();
          ctx.lineWidth = 5;
          ctx.beginPath();
          ctx.moveTo(topX, geo.topY + 18);
          ctx.lineTo(bottomX, geo.bottomY - 28);
          ctx.stroke();

          const g = ctx.createLinearGradient(topX, geo.topY, bottomX, geo.bottomY);
          g.addColorStop(0, 'rgba(255,255,255,.08)');
          g.addColorStop(.35, palette.main);
          g.addColorStop(1, palette.light);
          ctx.strokeStyle = g;
          ctx.globalAlpha = state.feverActive ? 0.9 : 0.75;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(topX, geo.topY + 18);
          ctx.lineTo(bottomX, geo.bottomY - 28);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;

        // Beat rails moving downward
        if (state.screen === 'playing' || state.screen === 'countdown' || state.screen === 'paused') {
          const beat = songBeat(currentSong());
          const t = Math.max(0, currentSongTime());
          for (let i = -2; i < 10; i++) {
            const beatTime = Math.floor(t / beat) * beat + i * beat;
            const delta = beatTime - t;
            if (delta < 0 || delta > APPROACH_TIME) continue;
            const p = 1 - delta / APPROACH_TIME;
            const y = lerp(geo.topY, geo.targetY, easeInQuad(p));
            const b = trackBoundsAt(easeInQuad(p), geo);
            ctx.strokeStyle = `rgba(255,255,255,${0.025 + p * 0.06})`;
            ctx.lineWidth = Math.round(beatTime / beat) % 4 === 0 ? 2 : 1;
            ctx.beginPath(); ctx.moveTo(b.left + 4, y); ctx.lineTo(b.left + b.width - 4, y); ctx.stroke();
          }
        }
      }

      function drawNotes(geo) {
        if (state.screen === 'result') return;
        const t = currentSongTime();
        for (let i = state.chartCursor; i < state.chart.length; i++) {
          const note = state.chart[i];
          if (note.time - t > APPROACH_TIME) break;
          if (note.type === 'hold') {
            if (note.holdState === 'completed') continue;
            if (note.endTime - t < -WINDOWS.miss) continue;
            drawHoldNote(note, t, geo);
            continue;
          }
          if (note.hit || note.missed) continue;
          const delta = note.time - t;
          if (delta < -WINDOWS.miss) continue;
          const p = easeInQuad(clamp(1 - delta / APPROACH_TIME, 0, 1));
          const y = lerp(geo.topY + 25, geo.targetY, p);
          const center = laneCenterAt(note.lane, p, geo);
          const bounds = trackBoundsAt(p, geo);
          const w = (bounds.width / geo.lanes) * 0.72;
          const h = lerp(35, 66, p);
          const isBoost = note.type === 'boost';
          drawNote(center - w / 2, y - h / 2, w, h, note.lane, p, isBoost ? boostPalette : null, isBoost);
        }
      }

      // O rastro do hold é projetado ponto a ponto pelo MESMO pipeline das cabeças
      // (easeInQuad + perspectiva) — um retângulo reto dessincronizaria da pista.
      function drawHoldNote(note, t, geo) {
        const active = note.holdState === 'active';
        const dead = note.holdState === 'broken' || note.holdState === 'missed';
        const palette = state.boostActive ? boostPalette : lanePalette[note.lane % lanePalette.length];
        const from = Math.max(note.time, t);
        const to = note.endTime;
        // whammy (Shift): a nota longa ativa treme como a alavanca do Guitar Hero
        const wob = active && state.whammy ? Math.sin(nowSec() * 40 + note.lane * 2) * 4 : 0;

        if (to > from) {
          const K = clamp(Math.ceil(((to - from) / APPROACH_TIME) * 12), 4, 16);
          const pts = [];
          for (let k = 0; k <= K; k++) {
            const ts = from + ((to - from) * k) / K;
            const prog = easeInQuad(clamp(1 - (ts - t) / APPROACH_TIME, 0, 1));
            const bounds = trackBoundsAt(prog, geo);
            pts.push({
              x: laneCenterAt(note.lane, prog, geo) + wob * (1 - k / K),
              y: lerp(geo.topY + 25, geo.targetY, prog),
              w: (bounds.width / geo.lanes) * 0.72 * lerp(0.6, 0.35, k / K)
            });
          }

          ctx.save();
          if (dead) {
            ctx.globalAlpha = 0.22;
            ctx.fillStyle = '#6b6d72';
          } else {
            ctx.globalAlpha = active ? 0.95 : 0.7;
            const g = ctx.createLinearGradient(0, pts[K].y, 0, pts[0].y);
            g.addColorStop(0, palette.main);
            g.addColorStop(1, palette.light);
            ctx.fillStyle = g;
            ctx.shadowColor = palette.glow;
            ctx.shadowBlur = 14 * neonPulse();
          }
          ctx.beginPath();
          ctx.moveTo(pts[0].x - pts[0].w / 2, pts[0].y);
          for (let k = 1; k <= K; k++) ctx.lineTo(pts[k].x - pts[k].w / 2, pts[k].y);
          for (let k = K; k >= 0; k--) ctx.lineTo(pts[k].x + pts[k].w / 2, pts[k].y);
          ctx.closePath();
          ctx.fill();
          ctx.shadowBlur = 0;

          if (!dead) {
            const tail = pts[K];
            ctx.beginPath();
            ctx.arc(tail.x, tail.y, Math.max(4, tail.w * 0.45), 0, TWO_PI);
            ctx.fill();
          }

          if (active) {
            ctx.globalCompositeOperation = 'lighter';
            ctx.globalAlpha = 0.3 * neonPulse();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(pts[0].x, pts[0].y);
            for (let k = 1; k <= K; k++) ctx.lineTo(pts[k].x, pts[k].y);
            ctx.stroke();
          }
          ctx.restore();
        }

        if (note.holdState === 'waiting') {
          const prog = easeInQuad(clamp(1 - (note.time - t) / APPROACH_TIME, 0, 1));
          const y = lerp(geo.topY + 25, geo.targetY, prog);
          const bounds = trackBoundsAt(prog, geo);
          const w = (bounds.width / geo.lanes) * 0.72;
          const h = lerp(35, 66, prog);
          drawNote(laneCenterAt(note.lane, prog, geo) - w / 2, y - h / 2, w, h, note.lane, prog);
        } else if (active) {
          const bounds = trackBoundsAt(1, geo);
          const w = (bounds.width / geo.lanes) * 0.72;
          const h = 66;
          const s = 1 + 0.05 * Math.sin(nowSec() * 12);
          drawNote(laneCenterAt(note.lane, 1, geo) + wob - (w * s) / 2, geo.targetY - (h * s) / 2, w * s, h * s, note.lane, 1);
        }
      }

      // Raios azuis na pista enquanto o boost está ativo (flicker suave, alpha baixo)
      function drawBoostLightning(geo) {
        if (!state.boostActive) return;
        const top = trackBoundsAt(0, geo);
        const bottom = trackBoundsAt(1, geo);
        const rand = seededRandom(Math.floor(nowSec() * 6) * 7919);
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.lineJoin = 'round';
        for (let i = 0; i < 3; i++) {
          const p0 = rand();
          const xTop = top.left + top.width * p0;
          const xBot = bottom.left + bottom.width * p0 + (rand() - 0.5) * 120;
          ctx.strokeStyle = i === 0 ? '#8ff7ff' : '#00b4ff';
          ctx.globalAlpha = 0.12 + rand() * 0.16;
          ctx.lineWidth = 1.5 + rand() * 1.5;
          ctx.beginPath();
          ctx.moveTo(xTop, geo.topY + 6);
          const steps = 6;
          for (let s = 1; s <= steps; s++) {
            const t = s / steps;
            ctx.lineTo(lerp(xTop, xBot, t) + (rand() - 0.5) * 46, lerp(geo.topY + 6, geo.bottomY - 10, t));
          }
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawNote(x, y, w, h, lane, p, pal, isBoost) {
        // durante o boost, TODAS as notas ficam azul neon
        const palette = pal || (state.boostActive ? boostPalette : lanePalette[lane % lanePalette.length]);
        const r = 7 + p * 4;
        ctx.save();
        ctx.shadowColor = palette.glow || palette.main;
        ctx.shadowBlur = lerp(8, 22, p) * neonPulse() + (state.feverActive ? 6 : 0) + (isBoost ? 6 : 0);
        fillRoundRect(x, y + 8, w, h, r, palette.dark);
        const g = ctx.createLinearGradient(x, y, x, y + h);
        g.addColorStop(0, palette.light);
        g.addColorStop(0.28, palette.main);
        g.addColorStop(1, palette.deep || palette.dark);
        fillRoundRect(x, y, w, h, r, g);
        ctx.shadowBlur = 0;
        if (isBoost) {
          ctx.globalCompositeOperation = 'lighter';
          ctx.globalAlpha = 0.25;
          fillRoundRect(x - 4, y - 4, w + 8, h + 8, r + 3, palette.main);
          ctx.globalAlpha = 1;
          ctx.globalCompositeOperation = 'source-over';
        }
        strokeRoundRect(x, y, w, h, r, 'rgba(255,255,255,.55)', 1.5);
        if (isBoost) {
          const cx = x + w / 2;
          const dy = y + 9 + 2 * p;
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.moveTo(cx, dy - 5); ctx.lineTo(cx + 4, dy); ctx.lineTo(cx, dy + 5); ctx.lineTo(cx - 4, dy);
          ctx.closePath();
          ctx.fill();
        }
        const label = currentSong().keys[lane];
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = `900 ${Math.round(18 + 18 * p)}px Arial Black, sans-serif`;
        ctx.lineWidth = 4;
        ctx.lineJoin = 'round';
        ctx.strokeStyle = 'rgba(0,0,0,.55)';
        ctx.strokeText(label, x + w / 2, y + h / 2 + 1);
        ctx.fillStyle = '#fff';
        ctx.fillText(label, x + w / 2, y + h / 2 + 1);
        ctx.restore();
      }

      function drawHitLineAndKeys(geo) {
        const bottom = trackBoundsAt(1, geo);
        const keyY = 735;
        const gap = 10;
        const keyW = (bottom.width - gap * (geo.lanes - 1)) / geo.lanes;
        const keyH = 78;
        const boostOnly = state.boostActive && !state.feverActive;

        // Linha de julgamento
        ctx.save();
        ctx.shadowColor = state.feverActive ? '#ffd15a' : boostOnly ? '#00eaff' : '#ffffff';
        ctx.shadowBlur = (16 + state.pulse * 16) * neonPulse();
        ctx.strokeStyle = state.feverActive ? '#ffd65d' : boostOnly ? '#8ff7ff' : '#f3eee5';
        ctx.lineWidth = 5;
        ctx.beginPath(); ctx.moveTo(bottom.left, geo.targetY); ctx.lineTo(bottom.left + bottom.width, geo.targetY); ctx.stroke();
        if (state.boostActive && state.feverActive) {
          ctx.shadowColor = '#00eaff';
          ctx.strokeStyle = '#8ff7ff';
          ctx.lineWidth = 3;
          ctx.beginPath(); ctx.moveTo(bottom.left, geo.targetY + 7); ctx.lineTo(bottom.left + bottom.width, geo.targetY + 7); ctx.stroke();
        }
        ctx.restore();

        // Banda de halo aditiva na linha
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        const band = ctx.createLinearGradient(0, geo.targetY - 13, 0, geo.targetY + 13);
        band.addColorStop(0, 'rgba(255,255,255,0)');
        band.addColorStop(0.5, 'rgba(255,255,255,.10)');
        band.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = band;
        ctx.fillRect(bottom.left, geo.targetY - 13, bottom.width, 26);
        ctx.restore();

        currentSong().keys.forEach((key, lane) => {
          const x = bottom.left + lane * (keyW + gap);
          const active = state.keysDown.has(key);
          const flash = state.activeKeyFlash.get(lane) || 0;
          const palette = lanePalette[lane % lanePalette.length];
          const fill = active || flash > 0.25 ? palette.dark : '#14191a';
          ctx.save();
          if (active || flash > 0) {
            ctx.shadowColor = palette.glow;
            ctx.shadowBlur = 26 * Math.max(flash, active ? 1 : 0);
          }
          fillRoundRect(x, keyY, keyW, keyH, 7, fill);
          if (active || flash > 0.2) {
            strokeRoundRect(x, keyY, keyW, keyH, 7, palette.light, active ? 4 : 3);
          } else {
            ctx.globalAlpha = 0.45;
            strokeRoundRect(x, keyY, keyW, keyH, 7, palette.main, 3);
            ctx.globalAlpha = 1;
          }
          ctx.fillStyle = active ? '#fff' : '#f4f0e8';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.font = '900 29px Arial Black, sans-serif';
          ctx.fillText(key, x + keyW / 2, keyY + keyH / 2 + 2);
          // Barra indicadora com glow falso em duas passadas
          ctx.globalAlpha = 0.3 * neonPulse();
          fillRoundRect(x - 2, keyY + keyH + 10, keyW + 4, 9, 4, palette.main);
          ctx.globalAlpha = 1;
          fillRoundRect(x, keyY + keyH + 12, keyW, 5, 3, palette.main);
          ctx.restore();
        });
      }

      function drawFeverBar(geo) {
        const bottom = trackBoundsAt(1, geo);
        const x = bottom.left + 65;
        const y = 846;
        const w = bottom.width - 130;
        const h = 28;
        fillRoundRect(x, y, w, h, 8, 'rgba(10,14,15,.88)');
        strokeRoundRect(x, y, w, h, 8, 'rgba(255,255,255,.14)', 3);
        const fillW = (w - 8) * (state.fever / 100);
        if (fillW > 0) {
          const g = ctx.createLinearGradient(x, y, x + w, y);
          g.addColorStop(0, '#dd425a');
          g.addColorStop(0.55, '#f05d67');
          g.addColorStop(1, state.feverActive ? '#ffd259' : '#a43f70');
          fillRoundRect(x + 4, y + 4, fillW, h - 8, 5, g);
        }
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = '900 17px Arial Black, sans-serif';
        ctx.fillText(state.feverActive ? `FEVER ×2  ${Math.ceil(state.fever)}%` : state.fever >= 100 ? 'ESPAÇO — ATIVAR FEVER' : `FEVER ${Math.floor(state.fever)}%`, x + w / 2, y + h / 2 + 1);
        ctx.fillStyle = '#ee415c';
        ctx.font = '900 24px Arial, sans-serif';
        ctx.fillText('♥', x - 25, y + h / 2 + 1);
      }

      function drawParticles() {
        const now = nowSec();
        for (const p of state.particles) {
          const age = now - p.born;
          const t = age / p.life;
          const x = p.x + p.vx * age;
          const y = p.y + p.vy * age + 0.5 * p.gravity * age * age;
          ctx.globalAlpha = (1 - t) * p.alpha;
          ctx.fillStyle = p.color;
          ctx.beginPath(); ctx.arc(x, y, p.size * (1 - t * 0.35), 0, TWO_PI); ctx.fill();
        }
        ctx.globalAlpha = 1;
      }

      function drawFloatingTexts(geo) {
        const now = nowSec();
        for (const f of state.floatingTexts) {
          const t = (now - f.born) / f.life;
          const x = laneCenterAt(f.lane, 1, geo);
          const y = geo.targetY - 42 - t * 70;
          ctx.globalAlpha = 1 - t;
          ctx.fillStyle = f.quality === 'perfect' ? '#ffd65c'
            : f.quality === 'great' ? '#c995ff'
            : f.quality === 'boost' ? '#8ff7ff'
            : f.quality === 'hold' ? '#9df5ff'
            : '#f3e1bc';
          ctx.font = '900 19px Arial Black, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(f.text, x, y);
        }
        ctx.globalAlpha = 1;
      }

      function drawFeedback() {
        if (!state.feedback) return;
        const age = nowSec() - state.feedbackAt;
        if (age > 0.82) return;
        const t = age / 0.82;
        const scale = 1 + (1 - easeOutCubic(clamp(age / 0.18, 0, 1))) * 0.35;
        ctx.save();
        ctx.translate(885, 615);
        ctx.scale(scale, scale);
        ctx.globalAlpha = 1 - Math.max(0, (t - 0.65) / 0.35);
        const color = state.feedback === 'PERFECT' ? '#f2b23d'
          : state.feedback === 'GREAT' ? '#a568d2'
          : state.feedback === 'GOOD' ? '#f1e2bf'
          : state.feedback === 'FEVER' ? '#ffd65c'
          : state.feedback === 'BOOST' ? '#33e0ff'
          : state.feedback === 'HOLD!' ? '#9df5ff'
          : state.feedback === 'WHAMMY' ? '#8ff7ff'
          : '#e45460';
        ctx.fillStyle = color;
        ctx.textAlign = 'center';
        ctx.font = 'italic 900 29px Arial Black, sans-serif';
        ctx.fillText(state.feedback, 0, 0);
        ctx.fillStyle = 'rgba(255,255,255,.72)';
        ctx.font = '800 11px Arial, sans-serif';
        ctx.fillText(state.feedbackSub, 0, 22);
        ctx.restore();
      }

      function drawSongProgress() {
        const progress = clamp(currentSongTime() / songLength(currentSong()), 0, 1);
        const x = 505;
        const y = 159;
        const w = 760;
        fillRoundRect(x, y, w, 5, 3, 'rgba(255,255,255,.12)');
        fillRoundRect(x, y, w * progress, 5, 3, state.feverActive ? '#d39aff' : state.boostActive ? '#00eaff' : '#f0ac3a');
      }

      function drawCountdown() {
        const remaining = -currentSongTime();
        const value = remaining > 0.5 ? Math.ceil(remaining) : 'GO!';
        ctx.save();
        ctx.fillStyle = 'rgba(0,0,0,.24)';
        ctx.fillRect(-1000, -600, DESIGN_W + 2000, DESIGN_H + 1200); // cobre também o bleed do fundo
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = '#f0a83b';
        ctx.shadowBlur = 25;
        ctx.fillStyle = '#fff3d0';
        ctx.font = '900 110px Arial Black, sans-serif';
        ctx.fillText(String(value), 885, 465);
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255,255,255,.8)';
        ctx.font = '800 18px Arial, sans-serif';
        ctx.fillText('PREPARE-SE', 885, 540);
        ctx.fillStyle = 'rgba(255,255,255,.55)';
        ctx.font = '600 13px Arial, sans-serif';
        ctx.fillText('SHIFT distorce notas longas (+bônus)  •  ESPAÇO ativa o Fever', 885, 572);
        ctx.restore();
      }

      function drawPauseOverlay() {
        ctx.fillStyle = 'rgba(4,6,7,.78)';
        ctx.fillRect(-1000, -600, DESIGN_W + 2000, DESIGN_H + 1200);
        fillRoundRect(540, 275, 520, 360, 24, 'rgba(16,20,21,.96)');
        strokeRoundRect(540, 275, 520, 360, 24, 'rgba(255,255,255,.16)', 2);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'alphabetic';
        ctx.fillStyle = '#f4f1e9';
        ctx.font = '900 54px Arial Black, sans-serif';
        ctx.fillText('PAUSADO', 800, 360);
        ctx.fillStyle = 'rgba(255,255,255,.66)';
        ctx.font = '600 17px Arial, sans-serif';
        ctx.fillText('Respire. O palco espera por você.', 800, 400);

        uiButton('resume', 620, 445, 360, 68);
        fillRoundRect(620, 445, 360, 68, 14, state.hoverTarget === 'resume' ? '#ffc45b' : '#efa83a');
        ctx.fillStyle = '#171714';
        ctx.font = '900 22px Arial Black, sans-serif';
        ctx.fillText('CONTINUAR  [P]', 800, 489);

        uiButton('pause-quit', 620, 528, 360, 46);
        fillRoundRect(620, 528, 360, 46, 12, state.hoverTarget === 'pause-quit' ? 'rgba(236,169,57,.22)' : 'rgba(236,169,57,.1)');
        strokeRoundRect(620, 528, 360, 46, 12, '#f1ad3b', 2);
        ctx.fillStyle = '#f1ad3b';
        ctx.font = '900 17px Arial Black, sans-serif';
        ctx.fillText('SAIR PARA MÚSICAS  [Q]', 800, 558);

        ctx.fillStyle = 'rgba(255,255,255,.52)';
        ctx.font = '700 14px Arial, sans-serif';
        ctx.fillText('R para reiniciar  •  ESC para continuar  •  Q para sair', 800, 608);
      }

      function drawResultOverlay() {
        ctx.fillStyle = 'rgba(4,6,7,.82)';
        ctx.fillRect(-1000, -600, DESIGN_W + 2000, DESIGN_H + 1200);
        fillRoundRect(395, 126, 810, 650, 28, 'rgba(15,19,20,.97)');
        strokeRoundRect(395, 126, 810, 650, 28, state.resultWon ? 'rgba(243,174,58,.55)' : 'rgba(227,74,91,.5)', 3);

        ctx.textAlign = 'center';
        ctx.textBaseline = 'alphabetic';
        ctx.fillStyle = state.resultWon ? '#f2b13d' : '#e55763';
        ctx.font = '900 26px Arial Black, sans-serif';
        ctx.fillText(state.resultWon ? 'APRESENTAÇÃO CONCLUÍDA' : 'APRESENTAÇÃO ENCERRADA', 800, 187);
        ctx.fillStyle = '#f4f0e8';
        ctx.font = '900 86px Arial Black, sans-serif';
        ctx.fillText(state.resultRank, 800, 283);
        ctx.fillStyle = 'rgba(255,255,255,.62)';
        ctx.font = '800 15px Arial, sans-serif';
        ctx.fillText(`${currentSong().title}  ·  META: ${Math.round(currentSong().minAccuracy * 100)}% DE PRECISÃO`, 800, 316);

        const stats = [
          ['PONTUAÇÃO', formatScore(state.score)],
          ['PRECISÃO', `${Math.round(getAccuracy() * 100)}%`],
          ['COMBO MÁXIMO', String(state.maxCombo)],
          ['PERFORMANCE', `${Math.round(state.performance)} / 100`]
        ];
        stats.forEach((s, i) => {
          const x = 455 + (i % 2) * 370;
          const y = 355 + Math.floor(i / 2) * 100;
          fillRoundRect(x, y, 320, 78, 12, 'rgba(255,255,255,.045)');
          ctx.textAlign = 'left';
          ctx.fillStyle = 'rgba(255,255,255,.55)';
          ctx.font = '800 12px Arial, sans-serif';
          ctx.fillText(s[0], x + 20, y + 25);
          ctx.fillStyle = '#f4f0e8';
          ctx.font = '900 27px Arial Black, sans-serif';
          ctx.fillText(s[1], x + 20, y + 58);
        });

        const judgeLabels = [
          ['PERFECT', state.counts.perfect, '#f1b13e'],
          ['GREAT', state.counts.great, '#a56ad2'],
          ['GOOD', state.counts.good, '#e6d3ad'],
          ['MISS', state.counts.miss, '#e65662']
        ];
        judgeLabels.forEach((j, i) => {
          const x = 470 + i * 170;
          ctx.textAlign = 'center';
          ctx.fillStyle = j[2];
          ctx.font = '900 14px Arial Black, sans-serif';
          ctx.fillText(j[0], x, 586);
          ctx.fillStyle = '#fff';
          ctx.font = '900 25px Arial Black, sans-serif';
          ctx.fillText(String(j[1]), x, 618);
        });

        uiButton('replay', 560, 650, 480, 76);
        fillRoundRect(560, 650, 480, 76, 15, state.hoverTarget === 'replay' ? '#ffc45b' : '#efa83a');
        ctx.fillStyle = '#181713';
        ctx.font = '900 24px Arial Black, sans-serif';
        ctx.fillText('JOGAR NOVAMENTE  [ENTER]', 800, 698);

        uiButton('result-back', 600, 738, 400, 28);
        ctx.fillStyle = state.hoverTarget === 'result-back' ? '#ffc45b' : '#f1ad3b';
        ctx.font = '800 15px Arial, sans-serif';
        ctx.fillText('ESCOLHER OUTRA MÚSICA  [ESC]', 800, 758);
      }

      // ---------- Toast + calibração ----------

      function showToast(text, ms = 2000) {
        state.toast = { text, until: nowSec() + ms / 1000 };
      }

      function drawToast() {
        if (!state.toast || nowSec() > state.toast.until) return;
        ctx.save();
        ctx.font = '800 16px Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const w = ctx.measureText(state.toast.text).width + 48;
        fillRoundRect(800 - w / 2, 96, w, 42, 12, 'rgba(9,12,13,.9)');
        strokeRoundRect(800 - w / 2, 96, w, 42, 12, 'rgba(241,173,59,.6)', 1.5);
        ctx.fillStyle = '#f2ad3b';
        ctx.fillText(state.toast.text, 800, 117);
        ctx.restore();
      }

      function nudgeCalib(deltaMs) {
        state.calibMs += deltaMs;
        saveCalib(currentSong().id, state.calibMs);
        const s = v => (v > 0 ? '+' : '') + v;
        showToast(`OFFSET DE ÁUDIO: ${s(deltaMs)} ms  (total: ${s(state.calibMs)} ms)`);
      }

      // ==================== Input ====================

      function getHitTarget(p) {
        for (let i = uiButtons.length - 1; i >= 0; i--) {
          const b = uiButtons[i];
          if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) return b.id;
        }
        return null;
      }

      function handleCanvasClick(target) {
        if (!target) return;
        if (target === 'title-start') {
          setupAudio();
          state.screen = 'songSelect';
          schedulePreview();
          srStatus.textContent = 'Seleção de músicas. Use as setas e Enter.';
          return;
        }
        if (target === 'disc-prev') { switchDisc(-1); return; }
        if (target === 'disc-next') { switchDisc(1); return; }
        if (target.indexOf('disc-dot-') === 0) {
          const i = Number(target.slice(9));
          if (i !== state.discIndex) switchDisc(i > state.discIndex ? 1 : -1);
          return;
        }
        if (target === 'song-export') { exportSongJson(selectedSong()); return; }
        if (target.indexOf('song-') === 0) {
          const i = Number(target.slice(5));
          if (state.selectIndex === i) startSelectedSong();
          else {
            state.selectIndex = i;
            state.rowByDisc[currentDisc().id] = i;
            saveLastSelection();
            schedulePreview();
            const song = selectedSong();
            srStatus.textContent = `${song.title}, ${song.artist}.`;
          }
          return;
        }
        if (target === 'replay') startSong(state.songIndex);
        else if (target === 'result-back') toSongSelect();
        else if (target === 'resume') pauseGame();
        else if (target === 'pause-quit') toSongSelect();
      }

      function handleKeyDown(e) {
        if (e.repeat) return;
        const key = e.key === ';' ? ';' : e.key.toUpperCase();

        // T alterna tela cheia em qualquer tela ('F' é tecla de pista, por isso T)
        if (key === 'T') {
          toggleFullscreen();
          return;
        }

        if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Enter', ' ', 'Escape'].includes(e.key)) e.preventDefault();

        if (state.screen === 'title') {
          if (e.key === 'Enter' || e.code === 'Space') {
            setupAudio();
            state.screen = 'songSelect';
            schedulePreview();
            srStatus.textContent = 'Seleção de músicas. Use as setas e Enter.';
          }
          return;
        }

        if (state.screen === 'songSelect') {
          if (e.key === 'ArrowLeft') switchDisc(-1);
          if (e.key === 'ArrowRight') switchDisc(1);
          if (e.key === 'ArrowUp' || key === 'W') moveRow(-1);
          if (e.key === 'ArrowDown' || key === 'S') moveRow(1);
          if (e.key === 'Enter') startSelectedSong();
          if (e.key === 'Escape') {
            stopPreview();
            state.screen = 'title';
            srStatus.textContent = 'Tela inicial.';
          }
          return;
        }

        if (state.screen === 'result') {
          if (e.key === 'Enter' || key === 'R') startSong(state.songIndex);
          if (e.key === 'Escape') toSongSelect();
          return;
        }

        if (state.screen === 'paused') {
          if (key === 'P' || e.key === 'Escape') pauseGame();
          if (key === 'R') startSong(state.songIndex);
          if (key === 'Q') toSongSelect();
          return;
        }

        // playing / countdown
        if (e.key === 'Shift') {
          state.whammy = true;
          if (state.screen === 'playing' && state.activeHolds.size > 0) {
            state.feedback = 'WHAMMY';
            state.feedbackSub = 'DISTORÇÃO +50%';
            state.feedbackAt = nowSec();
          }
          return;
        }
        if (e.key === ',') { nudgeCalib(-25); return; }
        if (e.key === '.') { nudgeCalib(25); return; }

        if (key === 'P' || e.key === 'Escape') {
          pauseGame();
          return;
        }

        if (key === 'R') {
          startSong(state.songIndex);
          return;
        }

        if (e.code === 'Space') {
          activateFever();
          return;
        }

        const lane = currentSong().keys.indexOf(key);
        if (lane >= 0) {
          state.keysDown.add(key);
          pressLane(lane);
        }
      }

      function handleKeyUp(e) {
        if (e.key === 'Shift') state.whammy = false;
        const key = e.key === ';' ? ';' : e.key.toUpperCase();
        state.keysDown.delete(key);
        const lane = currentSong().keys.indexOf(key);
        if (lane >= 0) releaseLane(lane);
      }

      function loop(ts) {
        const dt = Math.min(0.05, (ts - state.lastFrame) / 1000 || 0);
        state.lastFrame = ts;
        update(dt);
        draw();
        requestAnimationFrame(loop);
      }

      window.addEventListener('resize', fitCanvas);
      window.addEventListener('keydown', handleKeyDown, { passive: false });
      window.addEventListener('keyup', handleKeyUp);
      window.addEventListener('blur', () => {
        state.keysDown.clear();
        state.whammy = false;
        if (state.screen === 'playing') pauseGame();
      });

      canvas.addEventListener('mousemove', e => {
        const p = toDesign(e.clientX, e.clientY);
        state.mouse = p;
        state.hoverTarget = getHitTarget(p);
        canvas.style.cursor = state.hoverTarget ? 'pointer' : 'default';
      });

      canvas.addEventListener('mouseleave', () => {
        state.hoverTarget = null;
        canvas.style.cursor = 'default';
      });

      canvas.addEventListener('click', e => {
        setupAudio();
        if (state.awaitingAudio) yt.play();
        const p = toDesign(e.clientX, e.clientY);
        handleCanvasClick(getHitTarget(p));
        canvas.focus();
      });

      pauseBtn.addEventListener('click', () => pauseGame());
      muteBtn.addEventListener('click', () => {
        setupAudio();
        setMuted(!state.muted);
      });
      async function toggleFullscreen() {
        try {
          if (!document.fullscreenElement) await shell.requestFullscreen();
          else await document.exitFullscreen();
        } catch (_) {}
      }

      fullscreenBtn.addEventListener('click', toggleFullscreen);

      document.addEventListener('visibilitychange', () => {
        if (document.hidden && state.screen === 'playing') pauseGame();
      });

      fitCanvas();
      restoreLastSelection();
      loadExternalCharts();
      yt.init();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
